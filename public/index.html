<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skittles League</title>
<meta name="description" content="League tables, league fixtures and cup fixtures.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='8' fill='%231D4533'/%3E%3Cg fill='%23F3F1E6'%3E%3Ccircle cx='22' cy='8' r='3.4'/%3E%3Ccircle cx='15' cy='15' r='3.4'/%3E%3Ccircle cx='29' cy='15' r='3.4'/%3E%3Ccircle cx='8' cy='22' r='3.4'/%3E%3Ccircle cx='36' cy='22' r='3.4'/%3E%3Ccircle cx='15' cy='29' r='3.4'/%3E%3Ccircle cx='29' cy='29' r='3.4'/%3E%3Ccircle cx='22' cy='36' r='3.4'/%3E%3C/g%3E%3Ccircle cx='22' cy='22' r='4.2' fill='%23B7842A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
/* Layout: a bottle-green pub-sign band holds the league name and tabs; below it, a paper page with tables and fixture cards. Admin views split into list + form. */
:root {
  --paper: #F2F5F1;
  --surface: #FFFFFF;
  --sunk: #E8EEE9;
  --ink: #17241E;
  --muted: #5A6B62;
  --line: #D3DCD5;
  --baize: #1D4533;
  --baize-2: #275A43;
  --on-baize: #F3F1E6;
  --on-baize-muted: #B9C9BE;
  --brass: #B7842A;
  --brass-ink: #855A0F;
  --win: #2C7448;
  --loss: #A43E36;
  --draw: #82661A;
  --warn-bg: #FBF0D9;
  --nick: #0B7F8C;
  --font-display: "Rokkitt", "Rockwell", "Georgia", serif;
  --font-body: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1512; --surface: #15201B; --sunk: #1B2822; --ink: #E5ECE7; --muted: #94A59B; --line: #2A3A31;
    --baize: #12301F; --baize-2: #1B412C; --on-baize: #F1EEDF; --on-baize-muted: #9DB4A5;
    --brass: #D6A447; --brass-ink: #E3B862; --win: #5DBB80; --loss: #E07A70; --draw: #D4B45A; --warn-bg: #3A2F14; --nick: #4FD3E0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1512; --surface: #15201B; --sunk: #1B2822; --ink: #E5ECE7; --muted: #94A59B; --line: #2A3A31;
  --baize: #12301F; --baize-2: #1B412C; --on-baize: #F1EEDF; --on-baize-muted: #9DB4A5;
  --brass: #D6A447; --brass-ink: #E3B862; --win: #5DBB80; --loss: #E07A70; --draw: #D4B45A; --warn-bg: #3A2F14; --nick: #4FD3E0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
a { color: var(--brass-ink); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--baize); }
.wrap { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* Header band */
.band { background: var(--baize); color: var(--on-baize); }
.band .wrap { padding-block: 22px 0; }
.brand { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand > div:not(.acct) { min-width: 0; }
.acct { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: .92rem; }
.acct a, .acct button { color: var(--on-baize); background: none; border: 1px solid color-mix(in srgb, var(--on-baize) 35%, transparent); border-radius: 6px; padding: 6px 12px; font-weight: 600; text-decoration: none; cursor: pointer; }
.acct a:hover, .acct button:hover { background: var(--baize-2); }
.acct .who { color: var(--on-baize-muted); }
.brand svg { flex: none; }
.brand h1 { font-size: clamp(1.7rem, 4vw, 2.5rem); font-weight: 800; letter-spacing: .01em; }
.brand .season { color: var(--on-baize-muted); font-size: .95rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.tabs { display: flex; gap: 4px; margin-top: 18px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; color: var(--on-baize-muted); text-decoration: none; font-weight: 600; padding: 10px 14px; border-radius: var(--r) var(--r) 0 0; white-space: nowrap; }
.tabs a:hover { color: var(--on-baize); background: var(--baize-2); }
.tabs a[aria-current="page"] { background: var(--paper); color: var(--ink); }
.tabs .tab-row { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs .tab-row::-webkit-scrollbar { display: none; }
.tabs:has(.tab-row) { flex-direction: column; gap: 10px; overflow: visible; }
.tabs .admin-row { gap: 6px; align-items: center; }
.tabs .admin-row a { padding: 5px 12px; border-radius: 999px; font-size: .9rem; background: var(--baize-2); }
.tabs .admin-row a[aria-current="page"] { background: var(--paper); color: var(--ink); }
.tabs .admin-row .sep { margin-left: 0; }
.tabs .sep { flex: none; align-self: center; margin: 0 8px; color: var(--on-baize-muted); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
.tabs .end { margin-left: auto; }
.menu-btn, .tabs .acct-row { display: none; }
/* Phones: the tabs fold away behind a Menu button. */
@media (max-width: 720px) {
  .band .wrap { padding-block: 14px 0; }
  .brand { flex-wrap: nowrap; }
  .brand > div:not(.acct) { flex: 1; }
  .brand h1 { font-size: 1.5rem; }
  .brand .acct { display: none; }
  .menu-btn { display: inline-flex; flex: none; align-items: center; gap: 6px; margin-left: auto; color: var(--on-baize); background: none; border: 1px solid color-mix(in srgb, var(--on-baize) 35%, transparent); border-radius: 8px; padding: 8px 12px; font: 600 .95rem var(--font-body); cursor: pointer; }
  .menu-btn[hidden] { display: none; }
  .menu-btn:hover, .menu-btn[aria-expanded="true"] { background: var(--baize-2); }
  .menu-btn .badge { margin-left: 2px; }
  .tabs, .tabs:has(.tab-row) { display: none; }
  .band:has(.tabs:empty) .wrap, body:not(.menu-open) .band .wrap { padding-bottom: 14px; }
  body.menu-open .tabs { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; padding-bottom: 12px; }
  body.menu-open .tabs .tab-row { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 6px; overflow: visible; }
  body.menu-open .tabs .tab-row .sep { grid-column: 1 / -1; }
  body.menu-open .tabs a, body.menu-open .tabs .admin-row a { padding: 11px 14px; border-radius: 8px; font-size: 1rem; background: none; white-space: normal; }
  body.menu-open .tabs a:hover { background: var(--baize-2); }
  body.menu-open .tabs a[aria-current="page"] { background: var(--paper); color: var(--ink); }
  body.menu-open .tabs .admin-row { padding-bottom: 8px; border-bottom: 1px solid color-mix(in srgb, var(--on-baize) 20%, transparent); }
  body.menu-open .tabs .sep { margin: 4px 14px; align-self: flex-start; }
  body.menu-open .tabs .acct-row { border-top: 1px solid color-mix(in srgb, var(--on-baize) 20%, transparent); padding-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .tabs .acct-row a, .tabs .acct-row button { color: var(--on-baize); background: none; border: 1px solid color-mix(in srgb, var(--on-baize) 35%, transparent); border-radius: 6px; padding: 8px 12px !important; font: 600 .92rem var(--font-body); text-decoration: none; cursor: pointer; }
  .tabs .acct-row .who { color: var(--on-baize-muted); width: 100%; padding: 0 4px; }
}
.tabs button.end { flex: none; background: none; border: 0; color: var(--on-baize-muted); font-weight: 600; padding: 10px 14px; cursor: pointer; }
.tabs button.end:hover { color: var(--on-baize); }
.login { max-width: 420px; }

main { padding-block: 28px 64px; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
.view-head h2 { font-size: 1.9rem; font-weight: 800; }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.eyebrow { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--brass-ink); }

/* League table */
.division { margin-bottom: 32px; }
.division h3 { font-size: 1.35rem; margin-bottom: 10px; }
.table-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table.league { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 600px; }
.league th, .league td { padding: 10px 12px; text-align: right; white-space: nowrap; }
.league th { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; border-bottom: 2px solid var(--line); vertical-align: bottom; }
.league th abbr { text-decoration: none; cursor: help; }
/* Number columns are only as wide as their heading or figures; the team column takes the rest. */
.league th:not(.team), .league td:not(.team) { width: 1%; }
.league td { border-bottom: 1px solid var(--line); }
.league tr:last-child td { border-bottom: 0; }
.league .pos { text-align: center; width: 48px; font-weight: 700; color: var(--muted); }
.league tr:first-child .pos { color: var(--brass-ink); }
.league .team { text-align: left; font-weight: 600; white-space: normal; min-width: 180px; }
.league .pts { font-weight: 800; font-size: 1.05rem; background: var(--sunk); }
.league th.pts { background: var(--sunk); color: var(--ink); }
@media (max-width: 560px) {
  .league th, .league td { padding: 9px 6px; }
  .league .pos { width: 34px; }
  table.league { min-width: 100%; width: max-content; }
  .league .team { min-width: 0; }
  .league .team span { display: block; max-width: 128px; }
}
.neg { color: var(--loss); }
.pos-val { color: var(--win); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; color: var(--muted); font-size: .85rem; }
.legend b { color: var(--ink); font-weight: 600; }

/* Fixtures */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
#fx-team, #fx-jump { width: auto; max-width: 100%; }
.date-group[data-date] { scroll-margin-top: 12px; }
.date-group.jumped > h3 { animation: jumped 1.6s ease-out; }
@keyframes jumped { from { background: color-mix(in srgb, var(--brass) 30%, transparent); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .date-group.jumped > h3 { animation: none; } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--baize); color: var(--on-baize); }
.date-group { margin-bottom: 22px; }
.div-group + .div-group { margin-top: 12px; }
.div-group h4 { font-size: 1rem; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.date-group.next > h3 { color: var(--ink); }
details.late { margin-bottom: 18px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: var(--r); }
details.late summary { cursor: pointer; font-weight: 600; color: var(--muted); }
details.late[open] summary { margin-bottom: 12px; }
.date-group h3 { font-family: var(--font-body); font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.fx-list { display: grid; gap: 8px; }
.fx { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 4px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
.fx .home { text-align: right; font-weight: 600; min-width: 0; }
.fx .away { font-weight: 600; min-width: 0; }
.fx .score { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; text-align: center; min-width: 120px; }
.fx .score .v { color: var(--muted); font-weight: 500; font-size: .95rem; }
.fx .won { font-weight: 800; }
.fx .won .tn::after { content: " ✓"; color: var(--win); }
.fx .meta { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: .85rem; }
.chip { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.chip.cup { background: var(--brass); color: var(--on-brass, var(--surface)); }
.chip.warn { background: var(--warn-bg); color: var(--brass-ink); }
.round { margin-bottom: 26px; }
.round > h3 { font-size: 1.3rem; margin-bottom: 10px; }

/* Scorecards */
.sc-dlg { width: min(860px, calc(100vw - 16px)); max-height: calc(100dvh - 16px); padding: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); }
.sc-dlg::backdrop { background: rgb(0 0 0 / .45); }
.sc-form { display: grid; gap: 14px; padding: 16px; }
.sc-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.sc-head h3 { font-size: 1.25rem; }
.sc-dlg.two { width: min(1260px, calc(100vw - 16px)); }
.sc-sides { display: grid; gap: 14px; }
@media (min-width: 1180px) { .sc-dlg.two .sc-sides { grid-template-columns: 1fr 1fr; gap: 20px; } .sc-dlg.two .sc-row { grid-template-columns: 180px minmax(0, 1fr); } .sc-dlg.two .hand-cell input { width: 40px; height: 40px; } }
.sc-margins { font-size: .9rem; color: var(--muted); }
.sc-margins:empty { display: none; }
.sc-margins b { color: var(--ink); }
.sc-side { display: grid; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.sc-side-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 12px; align-items: center; }
.sc-side-head h4 { font-size: 1.05rem; }
.sc-rows { display: grid; gap: 10px; }
.sc-row { display: grid; grid-template-columns: minmax(180px, 250px) minmax(0, 1fr); gap: 6px 12px; align-items: center; }
.sc-player { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.sc-board-name { flex: 1 0 100%; font-size: .78rem; color: var(--brass-ink); font-weight: 600; }
.sc-photo { display: grid; gap: 8px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; background: var(--sunk); }
.sc-photo-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.sc-photo-bar .btn svg { vertical-align: -3px; margin-right: 4px; }
.sc-photo-msg:empty { display: none; }
.sc-photo-msg p { margin: 0; }
.sc-photo-msg .bad { color: var(--loss); font-weight: 600; }
.sc-photo-msg .good { font-weight: 600; }
.sc-photo-msg ul { margin: 6px 0 0; padding-left: 20px; font-size: .9rem; }
.sc-photo-msg .btn { margin-left: 8px; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; margin-right: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.sc-dlg .hand-cell.unsure input { outline: 3px solid var(--brass); outline-offset: 1px; background: var(--warn-bg); }
.sc-player > select, .sc-player > .sc-fixed { flex: 1; min-width: 0; }
.sc-move { display: inline-flex; flex-direction: column; gap: 2px; }
.sc-dlg .sc-move button { width: 26px; height: 20px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--muted); font-size: .7rem; line-height: 1; cursor: pointer; }
.sc-dlg .sc-move button:hover:not(:disabled) { color: var(--ink); border-color: var(--ink); }
.sc-dlg .sc-move button:disabled { opacity: .35; cursor: default; }
.sc-hands { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sc-rows[data-mode="hands"] .sc-total-in, .sc-rows[data-mode="totals"] .sc-hands { display: none; }
.sc-total-in { display: flex; flex-wrap: wrap; gap: 6px; }
.sc-dlg .sc-total-in input[data-total] { width: 90px; text-align: center; }
.sc-dlg .sc-total-in input[data-spares] { width: 190px; }
.hand-cell { position: relative; display: inline-grid; }
.sc-dlg .hand-cell input { width: 44px; height: 44px; padding: 0; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; border-radius: 6px; }
.sc-dlg .hand-cell[data-spare="1"] input { border-radius: 50%; border: 2px solid var(--ink); }
.hand-cell .sp { position: absolute; right: -6px; top: -6px; width: 18px; height: 18px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--muted); font-size: .62rem; font-weight: 800; cursor: pointer; line-height: 1; }
.hand-cell .sp[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.sc-row-total { min-width: 3ch; margin-left: 6px; font-weight: 800; font-variant-numeric: tabular-nums; }
.sc-sum { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; color: var(--muted); font-size: .9rem; }
.sc-sum strong { color: var(--ink); font-size: 1rem; }
.sc-foot { display: grid; gap: 8px; position: sticky; bottom: 0; background: var(--surface); padding: 10px 0 0; border-top: 1px solid var(--line); }
.sc-msg { margin: 0; color: var(--loss); font-weight: 600; }
.sc-msg:empty { display: none; }
@media (max-width: 560px) { .sc-row { grid-template-columns: minmax(0, 1fr); } .sc-dlg .hand-cell input { width: 40px; height: 40px; } }
.sc-title { font-weight: 700; }
.sc-table { width: 100%; border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
.sc-table th, .sc-table td { padding: 4px 6px; text-align: center; border-bottom: 1px solid var(--line); }
.sc-table th { font-size: .74rem; color: var(--muted); font-weight: 700; }
.sc-table .pl { text-align: left; }
.sc-table .tot, .sc-table tfoot td { font-weight: 800; }
.circ { display: inline-grid; place-items: center; min-width: 1.9em; height: 1.9em; border: 1.5px solid var(--ink); border-radius: 50%; }
.board { grid-column: 1 / -1; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.board .sc-table thead .pl { font-size: .85rem; }
.board tfoot .hand-tot td { border-top: 2px solid var(--ink); }
.board tfoot .tot.won { color: var(--win); }
.board .margins td { font-weight: 600; color: var(--ink); border-bottom: 0; }
.board .lost { color: var(--muted); }
details.sc-details { grid-column: 1 / -1; }
details.sc-details summary { cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--muted); text-align: center; }
details.sc-details[open] summary { margin-bottom: 8px; }
.pins-locked { background: var(--sunk) !important; }
/* Stats */
.st-tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 16px; }
.st-tools label { display: flex; gap: 8px; align-items: center; font-size: .85rem; font-weight: 600; color: var(--muted); }
.st-tools select { width: auto; }
.st-tools input[type=search] { flex: 1 1 200px; width: auto; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; }
.st-recs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 16px; }
.st-rec { display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.st-rec .lbl { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.st-rec b { font-size: 1.7rem; font-family: var(--font-display); line-height: 1.1; }
.st-rec span:last-child { font-size: .85rem; color: var(--muted); }
.st-table .sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; white-space: nowrap; }
.st-table .sorted, .st-table .sorted .sort, .st-table .sorted .st-name { color: var(--brass-ink); font-weight: 800; }
.st-table th.sorted { border-bottom-color: var(--brass); }
.st-pos tr.best td { color: var(--brass-ink); font-weight: 800; }
.st-table .st-name { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; text-align: left; }
.st-table .st-name:hover { text-decoration: underline; }
.st-table .st-team { display: block; font-size: .8rem; }

const msgTime = iso => new Date(iso).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const msgText = t => esc(t).replace(/\n/g, "<br>");
// A conversation: `me` is which side ("user" or "admin") is looking at it, shown on the right.
function chatHtml(messages, me, empty, them = "") {
  if (!messages.length) return `<p class="muted chat-empty">${empty}</p>`;
  return messages.map(m => `<div class="msg ${m.from === me ? "mine" : "theirs"}"><div class="msg-text">${msgText(m.text)}</div>
    <div class="msg-meta">${m.from === me ? "You" : esc(m.from === "admin" ? m.by || "Skittlers" : them || "Them")} · ${esc(msgTime(m.at))}</div></div>`).join("");
}
function wireComposer(form, onSend) {
  const box = $("textarea", form);
  form.addEventListener("submit", async e => {
    e.preventDefault(); const text = box.value.trim(); if (!text) return box.focus();
    const btn = $("button[type=submit]", form); btn.disabled = true;
    try { await onSend(text); box.value = ""; } catch (err) { toast(err.status ? err.message : "Couldn't send. Check your connection and try again."); }
    btn.disabled = false; box.focus();
  });
  box.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) form.requestSubmit(); });
}

/* ---------- public: fixtures ---------- */
function fxCard(f, showComp) {
  const { v, alley } = fxVenue(f);
  const p = played(f);
  const hw = p && f.homePins > f.awayPins, aw = p && f.awayPins > f.homePins;
  const where = v ? `${esc(v.name)}${alley ? ` · Alley ${alley}` : ""}` : "Venue to be confirmed";
  return `<div class="fx">
    <div class="home ${hw ? "won" : ""}"><span class="tn">${esc(teamName(f.home))}</span></div>
    <div class="score">${p ? `<span class="${hw ? "won" : ""}">${f.homePins}</span> <span class="v">–</span> <span class="${aw ? "won" : ""}">${f.awayPins}</span>` : `<span class="v">${esc(f.time || "v")}</span>`}</div>
    <div class="away ${aw ? "won" : ""}"><span class="tn">${esc(teamName(f.away))}</span></div>
    <div class="meta">${showComp && f.comp === "cup" ? `<span class="chip cup">${esc(f.round || "Cup")}</span> ` : ""}${f.postponedFrom && !p ? `<span class="chip warn">Postponed from ${esc(fmtDate(f.postponedFrom))}</span> ` : ""}${where}</div>
    ${(() => { const n = "pub" in f ? f.pub?.note : S.admin ? null : f.note; return n ? `<p class="fx-note">${esc(n)}</p>` : ""; })()}
    ${p && f.cards ? `<details class="sc-details"><summary>Scorecard</summary>${boardHtml(f.cards.home, f.cards.away, teamName(f.home), teamName(f.away))}</details>` : ""}
  </div>`;
}
// Fixtures under each date; with byDivision, split again by division (from the home team) in division order.
// The first date still to be played is marked as the next match night.
function groupByDate(list, desc, byDivision = false) {
  const g = {};
  list.forEach(f => (g[f.date || ""] ||= []).push(f));
  const keys = Object.keys(g).filter(Boolean).sort();
  if (desc) keys.reverse();
  if (g[""]) keys.push("");
  const next = keys.filter(d => d && d >= today() && g[d].some(f => !played(f))).sort()[0];
  const divs = sortedDivisions(), divOf = f => S.divisions[S.teams[f.home]?.division] ? S.teams[f.home].division : "";
  const split = fs => {
    if (byDivision) return nfColumns(fs, !!sharedTime(fs), true, true);
    if (!divs.length) return `<div class="fx-list">${fs.map(f => fxCard(f)).join("")}</div>`;
    return [...divs.map(d => d.id), ""].map(id => [id, fs.filter(f => divOf(f) === id)]).filter(([, x]) => x.length)
      .map(([id, x]) => `<div class="div-group"><h4>${esc(id ? divisionName(id) : "Not in a division")} <span class="chip">${esc(GAMES[gameOf(S.divisions[id])])}</span></h4><div class="fx-list">${x.map(f => fxCard(f)).join("")}</div></div>`).join("");
  };
  return keys.map(d => `<div class="date-group${d === next ? " next" : ""}" data-date="${d}"><h3>${d ? fmtDate(d, true) : "Date to be arranged"}${byDivision && sharedTime(g[d]) ? ` · ${esc(sharedTime(g[d]))}` : ""}${d === next ? ` <span class="chip ok">Next match night</span>` : ""}</h3>${split(g[d])}</div>`).join("");
}

      : noTeamsBlock();
    // Upcoming starts at the next match night; earlier games still waiting for a result are tucked away above.
    const late = S.ui.fxShow === "upcoming" ? list.filter(f => f.date && f.date < today()) : [];

    const dates = [...new Set(list.map(f => f.date).filter(Boolean))].sort(), months = {};

    $("#fx-jump").hidden = dates.length < 2;
    body.innerHTML = (late.length ? `<details class="late"><summary>${plural(late.length, "earlier game")} still waiting for a result</summary>${groupByDate(late, false, true)}</details>` : "") +
      (rest.length ? groupByDate(rest, S.ui.fxShow === "results", true) : `<div class="empty"><strong>No more fixtures to come</strong>Every fixture date has passed.</div>`);

  jump(value) {
    if (!value) return;
    const groups = $$("#fx-body .date-group[data-date]").filter(g => g.dataset.date.startsWith(value));

    target.scrollIntoView({ behavior: "smooth", block: "start" });

  }
};

    const g = { competition: f.comp === "league" ? pa[f.home]?.div || "League" : f.round || "Cup", home: teamName(f.home), away: teamName(f.away) };
    if (f.comp === "league" && pa[f.home] && pa[f.away] && pa[f.home].div === pa[f.away].div && pa[f.home].pos <= 3 && pa[f.away].pos <= 3) g.bigGame = `${ordinal(pa[f.home].pos)} v ${ordinal(pa[f.away].pos)}`;
    return g;
  }).slice(0, 40) } : null;
  const leagueNight = fx.some(f => f.comp === "league" && played(f));
  return {
    league: c.name, season: season?.name || "", matchNight: fmtDate(date, true), ...(leagueNight ? {} : { note: "No league games were played this night, so there's nothing to say about the league tables." }),
    howTheGameIsPlayed: `${c.players} a side, ${c.hands} hands of ${c.balls} balls each`, points: `${c.win} for a win, ${c.draw} for a draw`,
    results, topScores, bestHand: bestHand ? { ...who(bestHand.g), score: bestHand.v, hand: bestHand.n, spare: bestHand.spare } : null,
    spares: { total: spares.length, best: spares.slice(0, 5).map(h => ({ ...who(h.g), score: h.v, ...(h.n ? { hand: h.n } : {}) })) },
    personalBests: personalBests.slice(0, 6), seasonRecords: records, tables: leagueNight ? tables : [], form, nextNight,
  };
}
// The dates of cup results that a save has just entered: a final now complete, or a match given its result.
function cupResultDates(before, after) {
  if (after.structure === "final") return after.final?.date && (after.entrants || []).length >= 2 && cupFinal(after).complete && !cupFinal(before).complete ? [after.final.date] : [];
  const fresh = Object.entries(after.results || {}).filter(([mid, r]) => r?.aPins != null && before.results?.[mid]?.aPins == null).map(([mid]) => mid);
  return fresh.length ? cupBracket(after).rounds.flatMap(r => r.matches).filter(m => fresh.includes(m.id) && m.date).map(m => m.date) : [];
}
// After a result is saved, if it was the last one of a recent match night, ask for a report to be drafted.
async function reportCheck(dates) {
  if (!S.admin || !S.addons?.reports?.available || !dates.length) return;
  for (const d of new Set(dates)) if (d <= today() && d >= addDays(today(), -21) && nightGames(d).complete && !S.adminNews.some(n => n.report?.date === d && n.report?.season === S.seasonId)) {
    try {
      const r = await send(`/api/leagues/${S.league.id}/seasons/${S.seasonId}/report`, "POST", { date: d, facts: nightFacts(d), auto: true });
      setNews(r.items); refresh();
      if (!r.skipped) toast(`All results are in for ${fmtDate(d)}. A match report is being written. Check it on the News & photos page.`);
    } catch (e) { if (e.status !== 403) console.warn(e); }
  }
}
async function writeReport(date) {
  try { const r = await send(`/api/leagues/${S.league.id}/seasons/${S.seasonId}/report`, "POST", { date, facts: nightFacts(date) }); setNews(r.items); refresh(); toast("Writing the report. It'll appear here as a draft in a minute."); }
  catch (e) { saveError(e); }
}

// Files the league puts up for anyone: fixture books, rules, forms. PDFs and pictures open in the browser.
const DOC_KINDS = { "application/pdf": "PDF", "image/jpeg": "JPG", "image/png": "PNG", "text/csv": "CSV", "text/plain": "TXT", "application/msword": "DOC", "application/vnd.ms-excel": "XLS",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document": "DOC", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": "XLS" };
const DOC_CATEGORIES = ["Fixture books", "Rules", "Forms", "Minutes", "Results"];
const fileSize = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1e3))} KB`;
const docUrl = (d, download) => `/api/public/${encodeURIComponent(S.league.slug)}/docs/${encodeURIComponent(d.id)}${download ? "?download=1" : ""}`;
const docViewable = d => /^(application\/pdf|image\/(jpeg|png))$/.test(d.type);
function docRow(d, admin = false) {
  return `<li class="doc" data-doc-id="${esc(d.id)}"><span class="doc-kind k-${(DOC_KINDS[d.type] || "FILE").toLowerCase()}">${DOC_KINDS[d.type] || "FILE"}</span>
    <span class="doc-main"><strong>${esc(d.title)}</strong><span class="muted">${esc(d.name)} · ${fileSize(d.size)} · ${esc(fmtDate(d.created.slice(0, 10)))}</span></span>
    <span class="doc-acts">${docViewable(d) ? `<a class="btn ghost sm" href="${docUrl(d)}" target="_blank" rel="noopener" data-doc="${esc(d.id)}">Open</a>` : ""}<a class="btn sm" href="${docUrl(d, true)}" download="${esc(d.name)}" data-doc="${esc(d.id)}" data-doc-save="1">Download</a>
    ${admin ? `<button type="button" class="btn ghost sm" data-doc-edit="${esc(d.id)}">Edit</button><button type="button" class="btn danger sm" data-doc-del="${esc(d.id)}">Delete</button>` : ""}</span></li>`;
}
// Grouped by category, in the order they were first used, then "Other".
function docGroups(list) {
  const cats = [...new Set(list.map(d => d.category || ""))].sort((a, b) => !a - !b || DOC_CATEGORIES.indexOf(a) - DOC_CATEGORIES.indexOf(b) || a.localeCompare(b));
  return cats.map(c => [c || (cats.length > 1 ? "Other" : ""), list.filter(d => (d.category || "") === c)]);
}
// The preview has no real file addresses, so it fetches the file itself. It can't open new tabs or save files,
// so Open shows the file in a pop-up and Download explains; on the live site both are ordinary links.
document.addEventListener("click", async e => {
  const a = e.target.closest("a[data-doc]"); if (!a || !window.SKITTLERS_NAV) return;
  e.preventDefault();
  if (a.dataset.docSave) return toast("Downloading doesn't work in the preview. It will on the live site.");
  const d = S.docs.find(x => x.id === a.dataset.doc); if (!d) return;
  try {
    const res = await fetch(a.getAttribute("href")); if (!res.ok) throw 0;
    docViewer(d, URL.createObjectURL(await res.blob()));
  } catch { toast("That file couldn't be opened in the preview. It will on the live site."); }
});
function docViewer(d, url) {
  let dlg = $("#doc-dlg");
  if (!dlg) {
    dlg = document.createElement("dialog"); dlg.id = "doc-dlg"; dlg.className = "sc-dlg doc-dlg"; dlg.setAttribute("aria-labelledby", "doc-dlg-title"); document.body.append(dlg);
    dlg.addEventListener("click", e => { if (e.target === dlg || e.target.closest("[data-doc-close]")) dlg.close(); });
    dlg.addEventListener("close", () => { const u = dlg.dataset.url; if (u) setTimeout(() => URL.revokeObjectURL(u), 1000); });
  }
  dlg.dataset.url = url;
  dlg.innerHTML = `<div class="card-head"><div><h3 id="doc-dlg-title">${esc(d.title)}</h3><p class="lookup-note">${esc(d.name)} · ${fileSize(d.size)}</p></div><button type="button" class="btn ghost sm" data-doc-close>Close</button></div>
    ${d.type.startsWith("image/") ? `<img class="doc-view" src="${url}" alt="${esc(d.title)}">` : `<iframe class="doc-view" src="${url}" title="${esc(d.title)}"></iframe>`}
    <p class="hint">This is the preview. On the live site, Open shows the file in a new tab and Download saves it.</p>`;
  dlg.showModal();
}

/* ---------- cups: logic ---------- */
const CUP_TYPES = { knockout: "Knockout tournament" };
const CUP_FORMATS = { team: "Team", individual: "Individual player" };

const entriesText = n => `${n} ${n === 1 ? "entry" : "entries"}`;

// Bracket positions for seeds 1..size, e.g. 8 → [1,8,4,5,2,7,3,6], so byes (the highest seeds) are spread through the draw.
function seedOrder(size) { let o = [1]; while (o.length < size) { const n = o.length * 2; o = o.flatMap(s => [s, n + 1 - s]); } return o; }

  const R = cupRoundCount(n), byes = 2 ** R - n;
  const names = Array.from({ length: R }, (_, i) => roundName(i + 1, R));
  return `${entriesText(n)}: ${plural(R, "round")} (${names.join(", ")}).` +
    (byes ? ` ${byes === 1 ? "1 entry gets" : `${byes} entries get`} a bye through ${names[0] === "Final" ? "the first round" : names[0]} so the numbers work out.` : "");
}
function entrantLabel(cup, id) {
  if (!id) return "To be decided";
  if (cup.format === "team") return S.teams[id]?.name || cup.entrants?.find(e => e.id === id)?.label || "Unknown team";
  return cup.entrants?.find(e => e.id === id)?.label || "Unknown player";
}
// A pairs cup is a team cup whose teams are represented by the players ticked for the Pairs Cup on the Teams page.
// Cups made before the setting existed count as pairs cups when their name says so.
const isPairsCup = cup => cup.format === "team" && (cup.pairs ?? /\bpairs?\b/i.test(cup.name));
// A captains cup is an individual cup only open to players ticked as captain or vice captain on the Teams page.
const isCaptainsCup = cup => cup.format === "individual" && (cup.captains ?? /\bcaptains?\b/i.test(cup.name));
// The team's Pairs Cup players under its name; admins get a reminder when none are ticked.
function pairsLine(cup, id, admin = false) {
  if (!id || !isPairsCup(cup) || !S.teams[id]) return "";
  const names = pairsOf(S.teams[id]).map(playerHtml);
  if (names.length) return `<span class="entrant-players">${names.join(", ")}</span>`;

}
// Splits an individual entry's label, "Player (Team)", into the player and the team's current name.
function entrantParts(cup, id) {
  const label = entrantLabel(cup, id), team = S.teams[String(id).split(":")[1]];
  if (team && label.endsWith(` (${team.name})`)) return { player: label.slice(0, -team.name.length - 3), team: team.name };
  // The team may have been renamed: take the last bracketed part, allowing brackets inside it.
  if (label.endsWith(")")) for (let i = label.length - 1, depth = 0; i > 0; i--) {
    if (label[i] === ")") depth++;

  }

}
// How an entry shows in a draw: plain team name, or the team in bold with its players underneath

function entrantHtml(cup, id, admin = false, tag = "") {

// An entrant's home venue and alley: the team's, or for a player, their team's.
function entrantHome(cup, id) {
  if (!id) return null;
  const team = cup.format === "team" ? S.teams[id] : S.teams[String(id).split(":")[1]], v = S.venues[team?.venue];
  return v ? { venue: v.id, alley: v.alleys > 1 ? (team.alley || 1) : null } : null;
}
const homeKey = h => h ? `${h.venue}|${h.alley || 1}` : null;
const venueText = (venue, alley) => S.venues[venue] ? `${S.venues[venue].name}${alley ? ` · Alley ${alley}` : ""}` : "";
// Who can be entered: the season's teams, or every player on a team.
function cupCandidates(cup) {
  if (cup.format === "team") return sortedTeams().map(t => ({ id: t.id, label: t.name, search: t.name }));
  const entry = (t, p) => ({ id: `p:${t.id}:${searchText(fullName(p))}`, label: `${playerLabel(p)} (${t.name})`, search: `${fullName(p)} ${p.nick || ""} ${t.name}`, team: t.name, player: playerHtml(p) });
  // A captains cup has one entry per team: the captain, or the vice captain instead.
  if (isCaptainsCup(cup)) return sortedTeams().flatMap(t => {
    const ps = playersOf(t), options = [["Captain", ps.find(p => p.captain)], ["Vice captain", ps.find(p => p.vice)]]
      .filter(([, p]) => p && (p.first || p.last)).map(([role, p]) => ({ ...entry(t, p), role }));
    return options.length ? [{ team: t.name, teamId: t.id, options, search: options.map(o => o.search).join(" ") }] : [];
  });
  // Grouped by team in alphabetical order, then by player.
  return sortedTeams().flatMap(t => playersOf(t).filter(p => p.first || p.last)
    .sort((a, b) => playerLabel(a).localeCompare(playerLabel(b))).map(p => entry(t, p)));
}
// Works out every round from the draw and the results saved so far. Winners move through automatically;
// a result is ignored if an earlier result changed who's playing in that match.
// Places beyond the entries drawn are byes. A match with nobody in it is "empty", and whoever
// would have met its winner gets a bye through the next round.
function cupBracket(cup) {
  const R = cupRoundCount(cup.entries), size = 2 ** R, order = seedOrder(size), draw = cup.draw || [], n = draw.length;
  const rounds = []; let prev = null;
  for (let r = 1; r <= R; r++) {

    for (let k = 0; k < size / 2 ** r; k++) {
      const id = `${r}-${k}`, m = { id, round: r, slot: k, a: null, b: null, aPins: null, bPins: null, winner: null, bye: false, empty: false, tie: false };
      if (r === 1) {

        if (sa > n && sb > n) m.empty = true;

      } else {

        else { m.a = pa.winner; m.b = pb.winner; }

      else { m.venue = home?.venue || null; m.alley = home?.alley || null; m.venueChosen = false; }

    const byKey = {};

// because the first round is played on one night. Tries fresh shuffles, swapping home and away
// within a match where that helps; if it can't be done, returns the draw with the fewest clashes.
function drawAvoidingClashes(cup, ids, byeIds = []) {
  const size = 2 ** cupRoundCount(cup.entries), order = seedOrder(size), n = ids.length;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let best = null, bestClashes = Infinity;
  for (let attempt = 0; attempt < 3000 && bestClashes > 0; attempt++) {
    // Entries given a bye take the top seeds, which are the places drawn against a bye.

      if (ka && !used.has(ka)) used.add(ka);
      else if (kb && !used.has(kb)) { [d[pa], d[pb]] = [d[pb], d[pa]]; used.add(kb); }
      else if (!ka) { /* home side has no venue: nothing to clash */ }
      else if (!kb) [d[pa], d[pb]] = [d[pb], d[pa]];
      else clashes++;
    }

    .sort((a, b) => (b.pins ?? -1) - (a.pins ?? -1) || entrantLabel(cup, a.id).localeCompare(entrantLabel(cup, b.id)));

const whenText = (date, time) => date ? `${fmtDate(date)}${time ? ` · ${time}` : ""}` : "Date to be set";

/* ---------- statistics ---------- */
// Every game a player or team played, from the scorecards and results saved this season.
// A player's game: { comp, cupId, date, side, teamId, key, name, nick, total, hands, spares, opp, match, pos }
// pos is where the player threw in the team's order (1 = first), or null for a one-player card.
// A team's game: { comp, cupId, date, side, teamId, total, spares, opp }. side is "home", "away" or null (a final).
function statGames() {
  const players = [], teams = [];
  const addCard = (card, base) => {
    (card?.rows || []).forEach((r, i) => players.push({ ...base, key: `${base.teamId}|${r.key}`, name: r.name, nick: r.nick || "", total: r.total,
      hands: card.mode === "hands" ? r.hands : null, spares: card.mode === "hands" ? r.spares : null, spareScores: rowSpares(card, r), pos: card.rows.length > 1 ? i + 1 : null }));
  };
  const spareCount = card => { const per = (card?.rows || []).map(r => rowSpares(card, r)); return per.some(Boolean) ? per.reduce((n, x) => n + (x?.length || 0), 0) : null; };
  for (const f of Object.values(S.fixtures)) {
    if (!played(f)) continue;
    const comp = f.comp === "league" ? "league" : "cup", cupId = comp === "cup" ? "old" : null, match = `${teamName(f.home)} v ${teamName(f.away)}`;
    for (const [side, tid, opp, pins, card] of [["home", f.home, f.away, f.homePins, f.cards?.home], ["away", f.away, f.home, f.awayPins, f.cards?.away]]) {
      teams.push({ comp, cupId, date: f.date, side, teamId: tid, total: pins, spares: spareCount(card), opp: teamName(opp) });
      addCard(card, { comp, cupId, date: f.date, side, teamId: tid, opp: teamName(opp), match });
    }
  }
  for (const cup of Object.values(S.cups)) {
    const teamOf = id => cup.format === "team" ? id : String(id).split(":")[1];
    const teamGame = cup.format === "team" && !isPairsCup(cup), base = { comp: "cup", cupId: cup.id };
    if (cup.structure === "full") for (const r of cupBracket(cup).rounds) for (const m of r.matches) {
      if (m.bye || m.empty || m.aPins == null) continue;
      const match = `${entrantLabel(cup, m.a)} v ${entrantLabel(cup, m.b)}`;
      for (const [side, id, opp, pins, card] of [["home", m.a, m.b, m.aPins, m.cards?.a], ["away", m.b, m.a, m.bPins, m.cards?.b]]) {
        const g = { ...base, date: m.date, side, teamId: teamOf(id), opp: entrantLabel(cup, opp), match: `${cup.name}, ${r.name}: ${match}` };
        if (teamGame) teams.push({ ...g, total: pins, spares: spareCount(card) });
        if (card) addCard(card, g);
        else if (cup.format === "individual") { const p = entrantParts(cup, id); players.push({ ...g, key: `${g.teamId}|${String(id).split(":")[2]}`, name: p?.player || entrantLabel(cup, id), nick: "", total: pins, hands: null, spares: null }); }
      }
    } else for (const e of cup.entrants || []) {
      const pins = cup.final?.scores?.[e.id]; if (pins == null) continue;
      const card = cup.final?.cards?.[e.id], g = { ...base, date: cup.final.date, side: null, teamId: teamOf(e.id), opp: "Final", match: `${cup.name} final` };
      if (teamGame) teams.push({ ...g, total: pins, spares: spareCount(card) });
      if (card) addCard(card, g);
      else if (cup.format === "individual") { const p = entrantParts(cup, e.id); players.push({ ...g, key: `${g.teamId}|${String(e.id).split(":")[2]}`, name: p?.player || entrantLabel(cup, e.id), nick: "", total: pins, hands: null, spares: null }); }
    }
  }
  // A player who moved team keeps their history: games for the old team up to the transfer date join their
  // games for the new one. g.teamId stays the team they played for that night.
  for (const g of players) g.key = transferKey(g.key, g.date);
  return { players, teams };
}

const COMMITTEE_ROLES = [["president", "President"], ["chairman", "Chairman"], ["treasurer", "Treasurer"], ["secretary", "Secretary"]];
const COMMITTEE_ONE = new Set(COMMITTEE_ROLES.map(([k]) => k));
const roleName = r => Object.fromEntries(COMMITTEE_ROLES)[r] || "Committee member";
// The team a committee member plays for now: the one they were picked from, or wherever they've moved to since.
function committeeTeam(m) {
  const has = t => playersOf(t || {}).some(p => searchText(fullName(p)) === m.key);

// Transfers in date order, earliest first.

/* ---------- scorecards ---------- */
// A scorecard is one side's players and their scores, either hand by hand or each player's total only:
// { mode: "hands" | "totals", rows: [{ key, name, nick, hands: [n], spares: [bool], total }] }.
// A totals-only row can also list the spares the player hit: spareScores: [12, 14]. Older totals rows have none.
// A hand of 10 or more must include a spare; at 9 or under a spare is marked by hand. Spares are circled.
const upTo = n => Array.from({ length: n }, (_, i) => i);
const cardTotal = card => card.rows.reduce((n, r) => n + (r.total || 0), 0);
// The scores of the spares a player hit, from either kind of card, or null when the card doesn't say.
const rowSpares = (card, r) => card?.mode === "hands" ? r.hands.filter((_, h) => r.spares?.[h]) : Array.isArray(r.spareScores) ? r.spareScores : null;
const parseSpares = text => (String(text || "").match(/\d+/g) || []).map(Number);
// Each hand's total for the whole side, or null if the card isn't hand by hand.
function handTotals(card) {
  if (card?.mode !== "hands" || !card.rows?.length) return null;
  return upTo(Math.max(...card.rows.map(r => r.hands.length))).map(h => card.rows.reduce((n, r) => n + (r.hands[h] || 0), 0));
}
const cardName = r => esc(r.name) + (r.nick ? ` <em class="nick">${esc(r.nick)}</em>` : "");
// A team's players to choose from, with the ones in `first` (such as its Pairs Cup players) at the top.
function cardPlayers(teamId, first = []) {
  const ps = playersOf(S.teams[teamId] || {}).filter(p => p.first || p.last)
    .map(p => ({ key: searchText(fullName(p)), name: fullName(p), nick: p.nick || "", label: playerLabel(p) }));
  const top = new Set(first);
  return [...ps.filter(p => top.has(p.key)), ...ps.filter(p => !top.has(p.key)).sort((a, b) => a.label.localeCompare(b.label))];
}
// A match's two cards side by side, like the board at the alley: home on the left, away on the right.
// Under each hand's total, the side that won the hand shows its margin and the side that lost it a cross.
function boardHtml(home, away, homeTitle, awayTitle) {
  const H = handTotals(home), A = handTotals(away), both = H && A && H.length === A.length;
  const ht = home ? cardTotal(home) : null, at = away ? cardTotal(away) : null;
  const half = (card, title, theirs, won) => {
    if (!card?.rows?.length) return `<div class="board-half"><div class="sc-title tn">${esc(title)}</div><p class="muted">No scorecard</p></div>`;
    const T = handTotals(card), n = T ? T.length : 0;
    return `<div class="board-half"><div class="table-scroll"><table class="sc-table">
      <thead><tr><th class="pl"><span class="tn">${esc(title)}</span></th>${upTo(n).map(h => `<th>${h + 1}</th>`).join("")}<th class="tot">Total</th></tr></thead>
      <tbody>${card.rows.map(r => `<tr><td class="pl">${cardName(r)}${!T && r.spareScores?.length ? ` <span class="sp-list">${r.spareScores.map(v => `<span class="circ" title="Spare">${v}</span>`).join(" ")}</span>` : ""}</td>${upTo(n).map(h => `<td>${r.spares?.[h] ? `<span class="circ" title="Spare">${r.hands[h]}</span>` : r.hands?.[h] ?? ""}</td>`).join("")}<td class="tot">${r.total}</td></tr>`).join("")}</tbody>
      <tfoot><tr class="hand-tot"><td class="pl">Hands</td>${(T || []).map(x => `<td>${x}</td>`).join("")}<td class="tot${won ? " won" : ""}">${cardTotal(card)}</td></tr>
      ${both ? `<tr class="margins"><td class="pl">Won by</td>${T.map((x, i) => `<td>${x > theirs[i] ? x - theirs[i] : x < theirs[i] ? `<span class="lost" title="Hand lost">✗</span>` : "–"}</td>`).join("")}<td></td></tr>` : ""}</tfoot></table></div></div>`;
  };
  return `<div class="board">${half(home, homeTitle, A, ht > at)}${half(away, awayTitle, H, at > ht)}</div>`;
}

// The scorecard editor. Each side: { title, rows, hands, balls, game, players, fixed, prefill, card }.
// `fixed` is the one player of an individual cup entry; `prefill` lists player keys to start with.
// onSave gets one card per side, or null when the scorecard is removed.
const SC = { sides: [], onSave: null };
function openScorecard({ title, sides, onSave }) {
  let dlg = $("#sc-dlg");
  if (!dlg) {
    dlg = document.createElement("dialog"); dlg.id = "sc-dlg"; dlg.className = "sc-dlg"; dlg.setAttribute("aria-labelledby", "sc-title");
    document.body.append(dlg);
    dlg.addEventListener("close", () => scPhotoStop());
    dlg.addEventListener("change", e => { if (e.target.id === "sc-photo-file") { const files = [...e.target.files]; e.target.value = ""; if (files.length) scPhotoRead(files); } });
    dlg.addEventListener("input", e => {
      if (e.target.matches("[data-hand], [data-total]")) e.target.closest(".hand-cell, .sc-total-in")?.classList.remove("unsure");
      if (e.target.matches("[data-hand]")) scCell(e.target, true);
      if (e.target.matches("[data-hand], [data-total]")) scRecalc(+e.target.closest("[data-side]").dataset.side);
    });
    dlg.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.matches("[data-sp]")) { const cell = b.closest(".hand-cell"); cell.dataset.manual = cell.dataset.manual === "1" ? "0" : "1"; scCell($("input", cell), false); }
      if (b.dataset.mode) { const side = b.closest("[data-side]"); $(".sc-rows", side).dataset.mode = b.dataset.mode; $$("[data-mode]", side).forEach(x => x.setAttribute("aria-pressed", x === b)); scRecalc(+side.dataset.side); }
      if (b.dataset.mv) scMove(b.closest(".sc-row"), +b.dataset.mv);
      if (b.dataset.sc === "photo") $("#sc-photo-file").click();
      if (b.dataset.sc === "photo-stop") scPhotoStop("Stopped. The reading still counts towards this month's photos.");
      if (b.dataset.sc === "close") dlg.close();
      if (b.dataset.sc === "remove") { if (!arm(b, "Confirm remove")) return; dlg.close(); SC.onSave(null); }
    });
    dlg.addEventListener("keydown", e => {
      if (e.key !== "Enter" || !e.target.matches("[data-hand], [data-total], [data-spares]")) return;

function splitName(s) {

}

const stickerOf = t => playersOf(t).find(p => p.sticker) || null;

// e.g. John Smith “Smithy”

  const lines = String(v.address || "").split("\n").map(s => s.trim()).filter(Boolean);

}

/* ---------- postcodes & maps ---------- */
const POSTCODE_RE = /^([A-Z]{1,2}\d[A-Z\d]?)\s*(\d[A-Z]{2})$/i;
function normPostcode(s) { const m = POSTCODE_RE.exec(String(s || "").trim()); return m ? `${m[1]} ${m[2]}`.toUpperCase() : null; }
const geoCache = {};
// Resolves {lat, lng}, null when the postcode doesn't exist, or undefined when the lookup service can't be reached.
async function lookupPostcode(pc) {
  if (pc in geoCache) return geoCache[pc];
  try {
    const res = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(pc)}`);
    if (res.status === 404) return geoCache[pc] = null;
    if (!res.ok) return undefined;
    const { result } = await res.json();
    return geoCache[pc] = result ? { lat: result.latitude, lng: result.longitude } : null;
  } catch { return undefined; }
}
// Looks up many postcodes in one go (postcodes.io takes up to 100 per request).
async function lookupPostcodes(list) {
  const todo = [...new Set(list)].filter(pc => !(pc in geoCache));
  for (let i = 0; i < todo.length; i += 100) {
    try {
      const res = await fetch("https://api.postcodes.io/postcodes", {
        method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ postcodes: todo.slice(i, i + 100) }),
      });
      if (!res.ok) continue;
      for (const { query, result } of (await res.json()).result || [])
        geoCache[normPostcode(query) || query] = result ? { lat: result.latitude, lng: result.longitude } : null;
    } catch {}
  }
  return Object.fromEntries(list.map(pc => [pc, geoCache[pc]]));
}

// Reads CSV text into rows of trimmed cells, handling quoted cells with commas or line breaks.
function parseCsv(text) {
  const rows = []; let row = [], cell = "", quoted = false;
  text = String(text).replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c !== '"') cell += c;
      else if (text[i + 1] === '"') { cell += '"'; i++; }
      else quoted = false;
    } else if (c === '"') quoted = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim()));
}

// Maps each field to its column number, matching headings loosely ("Post code" = "Postcode").
function csvColumns(headRow, spec) {
  const key = h => h.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const head = (headRow || []).map(key), col = {};
  for (const [field, names] of Object.entries(spec)) { const i = head.findIndex(h => names.includes(h)); if (i >= 0) col[field] = i; }
  return col;
}

const PLAYER_COLUMNS = {
  team: ["teams", "team", "team name"],
  first: ["first name", "firstname", "first", "forename"],
  last: ["last name", "lastname", "last", "surname"],
  nick: ["nickname", "nick name", "nick"],
};
// Works out which players to add to which team, and which rows are flagged or skipped.
function playerImportPlan(text) {
  const rows = parseCsv(text);
  const plan = { add: [], already: 0, flagged: [], problems: [] };
  const col = csvColumns(rows[0], PLAYER_COLUMNS);
  if (!("team" in col) || !("first" in col)) return { ...plan, error: "This file needs Teams and First Name columns. Download the template and use its headings." };
  const teamByName = Object.fromEntries(Object.values(S.teams).map(t => [t.name.toLowerCase(), t]));
  const onTeam = {}, teamsWith = {};
  for (const t of Object.values(S.teams)) {
    onTeam[t.id] = new Set(playersOf(t).map(p => fullName(p).toLowerCase()));
    for (const p of playersOf(t)) { const k = nameKey(p); if (k) (teamsWith[k] ||= new Set()).add(t.name); }
  }
  rows.slice(1).forEach((r, i) => {
    if (!r.some(Boolean)) return;
    const line = i + 2, get = f => (f in col ? r[col[f]] || "" : "").replace(/\s+/g, " ").trim();
    const teamName = get("team"), player = { first: get("first"), last: get("last"), nick: get("nick") };
    const who = fullName(player) || "a player";
    if (!teamName) return plan.problems.push(`Row ${line} (${who}): no team given.`);
    const t = teamByName[teamName.toLowerCase()];
    if (!t) return plan.problems.push(`Row ${line} (${who}): there's no team called "${teamName}". Add the team first, then import again.`);
    if (!player.first) return plan.problems.push(`Row ${line} (${t.name}): no first name.`);
    const dk = fullName(player).toLowerCase();
    if (onTeam[t.id].has(dk)) return plan.already++;
    onTeam[t.id].add(dk);
    plan.add.push({ teamId: t.id, teamName: t.name, line, player });
  });
  // Flag names that are also on a different team, already saved or elsewhere in this file.
  const fileTeams = {};
  for (const a of plan.add) { const k = nameKey(a.player); if (k) (fileTeams[k] ||= new Set()).add(a.teamName); }
  for (const a of plan.add) {
    const k = nameKey(a.player); if (!k) continue;
    const others = [...new Set([...(teamsWith[k] || []), ...(fileTeams[k] || [])])].filter(n => n !== a.teamName);
    if (others.length) plan.flagged.push(`Row ${a.line}: ${fullName(a.player)} (${a.teamName}) is also on ${others.join(", ")}.`);
  }
  return plan;
}

const VENUE_COLUMNS = {
  name: ["venue name", "venue", "name"],
  address1: ["address line 1", "address 1", "address1", "address"],
  address2: ["address line 2", "address 2", "address2"],
  address3: ["address line 3", "address 3", "address3", "town"],
  postcode: ["postcode", "post code"],
  phone: ["telephone", "telephone number", "phone", "phone number", "tel"],
  alleys: ["number of alleys", "alleys", "no of alleys", "number of alley"],
};
// Works out which CSV rows add a venue, update one, or have a problem.
function venueImportPlan(text) {
  const rows = parseCsv(text);
  const plan = { add: [], update: [], same: [], problems: [] };
  const col = csvColumns(rows[0], VENUE_COLUMNS);
  if (!("name" in col)) return { ...plan, error: "This file needs a Venue Name column. Download the template and use its headings." };
  const byName = Object.fromEntries(Object.values(S.venues).map(v => [v.name.toLowerCase(), v]));
  const seen = new Set();
  rows.slice(1).forEach((r, i) => {
    if (!r.some(Boolean)) return;
    const line = i + 2, get = f => (f in col ? r[col[f]] || "" : "").replace(/\s+/g, " ").trim();
    const name = get("name");
    if (!name) return plan.problems.push(`Row ${line}: no venue name.`);
    if (seen.has(name.toLowerCase())) return plan.problems.push(`Row ${line} (${name}): this venue is listed more than once.`);
    seen.add(name.toLowerCase());
    const rec = { name, address1: get("address1"), address2: get("address2"), address3: get("address3"), postcode: "", phone: get("phone"), alleys: null };
    const pc = get("postcode");
    if (pc) { rec.postcode = normPostcode(pc); if (!rec.postcode) return plan.problems.push(`Row ${line} (${name}): "${pc}" isn't a UK postcode.`); }
    const al = get("alleys");
    if (al) { rec.alleys = /^\d+$/.test(al) ? +al : NaN; if (!(rec.alleys >= 1 && rec.alleys <= 20)) return plan.problems.push(`Row ${line} (${name}): number of alleys should be a whole number from 1 to 20, not "${al}".`); }
    const v = byName[name.toLowerCase()];
    if (!v) return plan.add.push(rec);
    const cur = { ...venueAddr(v), phone: v.phone || "", alleys: v.alleys || 1 }, changes = {};
    for (const f of ["address1", "address2", "address3", "postcode", "phone", "alleys"]) if (rec[f] && rec[f] !== cur[f]) changes[f] = rec[f];
    Object.keys(changes).length ? plan.update.push({ id: v.id, name: v.name, changes }) : plan.same.push(v.name);
  });
  return plan;
}

}

// One team per line; takes the first column of a CSV row and ignores a "Team Name" heading.
function parseTeamNames(text) {
  const out = [], seen = new Set();
  for (const line of String(text).replace(/^\uFEFF/, "").split(/\r?\n/)) {
    let cell = line.trim();
    if (cell.startsWith('"')) { const m = /^"((?:[^"]|"")*)"/.exec(cell); cell = m ? m[1].replace(/""/g, '"') : cell.slice(1); }
    else cell = cell.split(/[,\t]/)[0];
    cell = cell.trim().replace(/\s+/g, " ");
    if (!cell || /^team\s*names?$/i.test(cell) || seen.has(cell.toLowerCase())) continue;
    seen.add(cell.toLowerCase()); out.push(cell);
  }
  return out;
}

  reset() {

  // Splits the pasted or uploaded names into teams to add and ones already on the system.
  importPlan() {

    const existing = new Set(Object.values(S.teams).map(t => t.name.toLowerCase()));

    $("#imp-summary").textContent = !add.length && !skip.length ? ""
      : [add.length ? `${add.length} new team${add.length > 1 ? "s" : ""} ready to add.` : "No new teams to add.",
         skip.length ? `Already on the system, so skipped: ${skip.join(", ")}.` : ""].filter(Boolean).join(" ");
  },
  playerText: "",
  playerSummary() {

    const plan = playerImportPlan(this.playerText);
    const n = plan.add.length, nTeams = new Set(plan.add.map(a => a.teamId)).size;
    btn.disabled = !n;
    btn.textContent = n ? `Import ${n} player${n > 1 ? "s" : ""}` : "Import players";
    if (plan.error) return out.innerHTML = `<p class="imp-problem">${esc(plan.error)}</p>`;
    const lines = [n ? `${n} player${n > 1 ? "s" : ""} to add to ${nTeams} team${nTeams > 1 ? "s" : ""}.` : "No new players to add."];
    if (plan.already) lines.push(`${plan.already} already on their team, so skipped.`);
    out.innerHTML = `<p class="lookup-note">${esc(lines.join(" "))}</p>` +
      (plan.flagged.length ? `<p class="dup-note" style="margin:0">Already on system. These will still be added, so check them:</p>
        <ul class="imp-problems">${plan.flagged.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : "") +
      (plan.problems.length ? `<p class="imp-problem">${plan.problems.length} row${plan.problems.length > 1 ? "s" : ""} will be skipped. Fix ${plan.problems.length > 1 ? "them" : "it"} in the file and import it again:</p>
        <ul class="imp-problems">${plan.problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : "");

  async importPlayers() {

      for (const { teamId, player } of plan.add) {

      toast(`Added ${plan.add.length} player${plan.add.length > 1 ? "s" : ""}`);
      this.playerText = ""; $("#pimp-file").value = "";

  },
  async importTeams() {

      for (const name of add) {
        const id = newId() + Math.random().toString(36).slice(2, 5);
        d.teams[id] = { id, name, venue: null, alley: null, captainFirst: "", captainLast: "", players: [] };
      }
    });

  syncAlley(selected) {

  },
  // Flags a player whose first and last name match a player on another team, or another row on this form.
  checkDuplicates() {
    const editing = $("#team-form").dataset.id;
    const known = {};
    for (const t of Object.values(S.teams)) {
      if (t.id === editing) continue;
      for (const p of playersOf(t)) { const k = nameKey(p); if (k) (known[k] ||= new Set()).add(t.name); }
    }
    const rows = $$("#t-players .player");
    const keys = rows.map(r => nameKey({ first: $(".p-first", r).value.trim(), last: $(".p-last", r).value.trim() }));
    rows.forEach((r, i) => {
      const k = keys[i];
      const where = k ? [...(known[k] || [])] : [];
      if (k && keys.some((x, j) => j !== i && x === k)) where.push("this team");
      const note = $(".dup-note", r);
      note.hidden = !where.length;
      note.textContent = where.length ? `Already on system (${where.join(", ")})` : "";
    });
  },
  edit(id) {
    const t = S.teams[id], c = S.contacts[id] || {};

    $("#t-name").value = t.name || "";

    if (fullName(cap) && !players.some(p => p.captain)) {
      const match = players.find(p => nameKey(p) === nameKey(cap));
      if (match) match.captain = true; else players.unshift({ ...cap, nick: "", captain: true });

  },
  showCaptain() {
    const row = $$("#t-players .player").find(r => $(".p-captain", r).checked);

      : "Tick Captain next to a player below.";
  },
  async save() {
    const f = $("#team-form");
    const name = $("#t-name").value.trim();
    if (!name) return toast("Give the team a name.");
    const dup = Object.values(S.teams).find(t => t.name.toLowerCase() === name.toLowerCase() && t.id !== f.dataset.id);
    if (dup) return toast(`There's already a team called ${dup.name}.`);
    const venue = $("#t-venue").value || null;
    const nAlleys = S.venues[venue]?.alleys || 1;
    const team = {
      name, venue,
      alley: venue ? Math.min(+$("#t-alley").value || 1, nAlleys) : null,
      players: $$("#t-players .player").map(r => ({ first: $(".p-first", r).value.trim(), last: $(".p-last", r).value.trim(), nick: $(".p-nick", r).value.trim(),
        ...roleFlags(Object.fromEntries(ROLES.map(([k]) => [k, $(".p-" + k, r).checked]))) })).filter(p => p.first || p.last || p.nick),
    };
    const cap = team.players.find(p => p.captain);
    team.captainFirst = cap?.first || ""; team.captainLast = cap?.last || "";
    const email = $("#t-email").value.trim();
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast("Check the captain's email address.");
    const contact = { email, address: $("#t-address").value.trim(), mobile: $("#t-mobile").value.trim() };

  // Every player as "Name (Team)" for the committee search.
  committeeChoices() {

  committeeForm() {

    const holder = role => Object.values(S.committee || {}).find(m => m.role === role);
    const who = m => `${esc(playerLabel(m))} <span class="muted tn">${esc(teamName(committeeTeam(m)))}</span>`;
    this.comEditing ||= new Set();
    $("#com-roles").innerHTML = COMMITTEE_ROLES.map(([k, label]) => { const m = holder(k), search = !m || this.comEditing.has(k);
      return `<div class="field com-role"><label for="com-${k}">${label}</label>${search
        ? `<div class="com-pick"><input type="search" id="com-${k}" list="com-players" data-com-role="${k}" placeholder="${m ? `Search to replace ${esc(playerLabel(m))}` : "Search players"}" autocomplete="off">${m ? `<button type="button" class="btn ghost sm" data-com-keep="${k}">Keep</button>` : ""}</div>`
        : `<div class="com-held"><span>${who(m)}</span><span class="actions"><button type="button" class="btn ghost sm" data-com-change="${k}">Change</button><button type="button" class="btn ghost sm" data-com-remove="${esc(m.id)}">Remove</button></span></div>`}</div>`; }).join("");

  },
  // Sets a post from what was picked in the search box. A label that isn't a player is ignored with a hint.
  async setCommittee(role, label, input) {
    if (!label.trim()) return;

    if (!c) return toast("Pick a player from the list as you type.");
    if (Object.values(S.committee || {}).some(m => m.key === c.key && m.team === c.team && m.role === role)) return toast(`${playerLabel(c)} is already ${role === "member" ? "on the committee" : roleName(role).toLowerCase()}.`);
    const id = COMMITTEE_ONE.has(role) ? role : newId();

  // The transfer form: teams to choose from, the old team's players, and what the move will do.
  transferForm() {
    const teams = sortedTeams(), from = $("#x-from"), to = $("#x-to"), pl = $("#x-player");
    const keep = [from.value, to.value, pl.value];
    from.innerHTML = `<option value="">Choose the team</option>` + teams.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
    from.value = S.teams[keep[0]] ? keep[0] : "";
    const players = from.value ? playersOf(S.teams[from.value]).filter(p => p.first || p.last).sort((a, b) => playerLabel(a).localeCompare(playerLabel(b))) : [];
    pl.innerHTML = `<option value="">${from.value ? "Choose the player" : "Choose the team first"}</option>` + players.map(p => `<option value="${esc(searchText(fullName(p)))}">${esc(playerLabel(p))}</option>`).join("");
    pl.disabled = !from.value; pl.value = players.some(p => searchText(fullName(p)) === keep[2]) ? keep[2] : "";
    to.innerHTML = `<option value="">Choose the new team</option>` + teams.filter(t => t.id !== from.value).map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
    to.value = S.teams[keep[1]] && keep[1] !== from.value ? keep[1] : "";
    const p = players.find(x => searchText(fullName(x)) === pl.value), date = $("#x-date").value;
    const clash = p && to.value && playersOf(S.teams[to.value]).some(x => searchText(fullName(x)) === pl.value);
    const roles = p ? ROLES.filter(([k]) => p[k]).map(([, l]) => l.toLowerCase()) : [];
    const cupEntries = p ? Object.values(S.cups).filter(c => c.format === "individual" && (c.entrants || []).some(e => e.id === `p:${from.value}:${pl.value}`)).map(c => c.name) : [];
    const notes = [];
    if (clash) notes.push(`${teamName(to.value)} already has a player called ${fullName(p)}.`);
    else if (p && to.value) {
      notes.push(`${playerLabel(p)} moves from ${teamName(from.value)} to ${teamName(to.value)}${date ? ` on ${fmtDate(date)}` : ""}. Their games for ${teamName(from.value)} stay in their stats.`);
      if (roles.length) notes.push(`They're ${roles.join(", ")} for ${teamName(from.value)}; ${roles.length > 1 ? "those are" : "that's"} cleared, so pick someone else on the Teams form.`);
      if (cupEntries.length) notes.push(`Their entry in ${cupEntries.join(", ")} stays as it is.`);
    }
    $("#x-note").textContent = notes.join(" ");
    $("#x-go").disabled = !(p && to.value && date && !clash);
    // This season's transfers, newest first; the latest move of a player can be undone.
    const list = sortedTransfers().reverse(), latest = new Set();
    $("#x-list").innerHTML = list.length ? `<h4>Transfers this season</h4><ul class="x-list">${list.map(t => {
      const undo = !latest.has(t.key) && playersOf(S.teams[t.to] || {}).some(x => searchText(fullName(x)) === t.key); latest.add(t.key);

    }).join("")}</ul>` : "";
  },
  async transfer(btn) {
    const from = $("#x-from").value, to = $("#x-to").value, key = $("#x-player").value, date = $("#x-date").value;

          <div class="sub">${divisionName(t.division) ? `${esc(divisionName(t.division))} · ` : ""}${v ? `${esc(v.name)}${v.alleys > 1 ? ` · Alley ${t.alley || 1}` : ""}` : "No home venue"} · ${players.length} player${players.length === 1 ? "" : "s"}</div></div>

    const geo = await lookupPostcodes(lookups);

    // Turn each linked set whichever way evens out home and away games, avoiding runs at home.
    const sets = {}; ms.forEach((_, i) => (sets[find(i)] ||= []).push(i));
    const flip = [];
    for (const idx of Object.values(sets)) {
      const cost = rootFlip => idx.reduce((c, i) => {
        const f = par[i] ^ rootFlip, h = f ? ms[i].b : ms[i].a, a = f ? ms[i].a : ms[i].b;
        return c + ((home[h] || 0) - (away[h] || 0)) + ((away[a] || 0) - (home[a] || 0)) + (last[h] === "h" ? 2 : 0) + (last[a] === "a" ? 2 : 0);
      }, 0);
      const rootFlip = cost(1) < cost(0) || (cost(1) === cost(0) && Math.random() < 0.5) ? 1 : 0;
      for (const i of idx) flip[i] = par[i] ^ rootFlip;
    }
    const games = ms.map((m, i) => ({ div: m.div, home: flip[i] ? m.b : m.a, away: flip[i] ? m.a : m.b }));
    for (const g of games) { home[g.home] = (home[g.home] || 0) + 1; away[g.away] = (away[g.away] || 0) + 1; last[g.home] = "h"; last[g.away] = "a"; }
    // Check the rule for both halves: the second half swaps home and away.
    for (const [k, ts] of groups) {
      const h = ts.filter(t => games.some(g => g.home === t)), a = ts.filter(t => games.some(g => g.away === t));
      if (h.length > 1) clashes.push({ night, half: 1, alley: k, teams: h });
      if (a.length > 1) clashes.push({ night, half: 2, alley: k, teams: a });

// The setup checklist for the season being worked on, in the order a secretary sets things up.
function setupSteps() {
  const s = currentSeason(); if (!s || !ready()) return "";
  const teams = Object.values(S.teams), nPlayers = teams.reduce((n, t) => n + playersOf(t).length, 0);
  const divs = sortedDivisions(), placed = teams.filter(t => S.divisions[t.division]).length;
  const nVenues = Object.keys(S.venues).length, nFx = Object.values(S.fixtures).filter(f => f.comp === "league").length;
  const steps = [
    [true, "Season", `${s.name}, ${dayMonthYear(s.start)} to ${dayMonthYear(s.end)}`, "seasons"],
    [nVenues > 0, "Venues", nVenues ? plural(nVenues, "venue") : "None added yet", "venues"],
    [teams.length > 0, "Teams and players", teams.length ? `${plural(teams.length, "team")}, ${plural(nPlayers, "player")}` : "None added yet", "teams"],
    [divs.length > 0 && teams.length > 0 && placed === teams.length, "Divisions", divs.length ? `${plural(divs.length, "division")}, ${placed} of ${plural(teams.length, "team")} placed` : "Not set up yet", "divisions"],

}

async function loadExample() {
  if (S.busy) return;

  const ok = await commit(d => {
    const vid = {}, div = newId() + "div";
    d.divisions[div] = { id: div, name: "Division 1", order: 1 };
    const V = [
      ["plough", "The Plough", 1, 2, "Taunton", "TA1 1AA", 51.0152, -3.1009],
      ["lion", "Red Lion", 2, 1, "Bridgwater", "TA6 3AA", 51.1283, -3.0035],
      ["crown", "Crown & Anchor", 3, 3, "Wellington", "TA21 8AA", 50.9786, -3.2265],
    ];
    for (const [key, name, n, alleys, town, postcode, lat, lng] of V) {
      const id = newId() + key;
      d.venues[id] = { id, name: `${name} (example)`, address1: `${n} Example Street`, address2: town, address3: "Somerset", postcode, lat, lng, phone: `01632 96000${n}`, alleys };
      vid[key] = id;
    }
    const T = [
      ["Plough Pinheads", "plough", 1], ["Ploughshares", "plough", 2], ["Lion Hearts", "lion", 1],
      ["Anchor Men", "crown", 1], ["Crown Jewels", "crown", 2], ["Sunday Spares", "crown", 3],
    ];
    const tid = T.map(([name, v, alley], i) => {
      const id = newId() + i;
      const surname = ["Ashby", "Brook", "Carter", "Dunn", "Ellis", "Fry"][i];
      d.teams[id] = { id, name: `${name} (example)`, division: div, venue: vid[v], alley, captainFirst: "Dave", captainLast: surname,
        players: ["Dave", "Sue", "Tom", "Jan", "Pete", "Liz", "Mark", "Kate"].map(first => ({ first, last: surname, nick: { Dave: "Tank", Liz: "Lucky" }[first] || "", ...roleFlags({ captain: first === "Dave", vice: first === "Tom", sticker: first === "Sue", pairs: first === "Pete" || first === "Liz" }) })) };
      d.contacts[id] = { email: `dave.${surname.toLowerCase()}@example.com`, address: `${i + 10} Example Close\nSomerset`, mobile: `07700 9000${i + 10}` };
      return id;
    });
    let seed = 7, k = 0;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    // Six of the team's players, each throwing six hands; about one hand in eight is a spare.
    const exampleCard = (team, shift) => ({ mode: "hands", rows: upTo(6).map(i => {
      const p = team.players[(i + shift) % team.players.length];
      const hands = [], spares = [];
      for (let h = 0; h < 6; h++) { const sp = rnd() < 0.12; spares.push(sp); hands.push(sp ? 9 + Math.floor(rnd() * 8) : 3 + Math.floor(rnd() * 7)); }
      return { key: searchText(fullName(p)), name: fullName(p), nick: p.nick || "", hands, spares, total: hands.reduce((a, b) => a + b, 0) };
    }) });
    const now = today();
    roundRobin(tid, true).forEach((pairs, r) => {
      const date = addDays("2026-09-10", r * 7);
      for (const [home, away] of pairs) {
        const id = newId() + "x" + k++, p = date < now;
        d.fixtures[id] = { id, comp: "league", round: null, date, time: "19:45", home, away, venue: null, alley: null, homePins: null, awayPins: null };
        if (p) {
          const cards = { home: exampleCard(d.teams[home], r), away: exampleCard(d.teams[away], r + 3) };
          Object.assign(d.fixtures[id], { cards, homePins: cardTotal(cards.home), awayPins: cardTotal(cards.away) });
        }
      }
    });
    // A six-team knockout cup: two byes, then semi-finals and a final. The first round has been played.
    const cid = newId() + "cup", draw = [tid[5], tid[0], tid[3], tid[1], tid[4], tid[2]];
    const cup = { id: cid, name: "League Cup (example)", type: "knockout", format: "team", structure: "full", entries: 6,
      entrants: tid.map(id => ({ id, label: d.teams[id].name })), draw, results: {}, schedule: {}, final: { scores: {} }, created: new Date().toISOString(),
      roundDates: { 1: { date: "2026-10-22", time: "19:45" }, 2: { date: "2026-11-26", time: "19:45" }, 3: { date: "2027-01-14", time: "19:45" } } };
    d.cups = { [cid]: cup };
    const saved = S.cups; S.cups = d.cups;
    const firstRound = cupBracket(cup).rounds[0].matches.filter(m => !m.bye);
    S.cups = saved;
    firstRound.forEach((m, i) => { cup.results[m.id] = { a: m.a, b: m.b, aPins: [301, 276][i], bPins: [288, 276][i], winner: i === 1 ? m.b : null }; });
  }, { live: true }); // the example's results go straight on the live site
  S.busy = false;
  if (ok) toast("Example season loaded");
}

    if (rows.length > 1) b.closest(".player").remove();
    else { $$("input[type=text]", rows[0]).forEach(i => i.value = ""); $$("input[type=checkbox]", rows[0]).forEach(i => i.checked = false); $(".player-roles", rows[0]).hidden = true; }
    VIEWS.teams.checkDuplicates(); VIEWS.teams.showCaptain();
  }
  if (act === "edit-team") VIEWS.teams.edit(id);
  if (act === "bk-download") downloadBackup();
  if (act === "bk-restore") VIEWS["league-setup"].restoreCopy(id, b);
  if (act === "bk-restore-file") VIEWS["league-setup"].restoreFile(b);
  if (act === "toggle-team") VIEWS.teams.toggle(id);
  if (act === "teams-expand" || act === "teams-collapse") VIEWS.teams.toggleAll(act === "teams-expand");
  if (act === "cancel-team") VIEWS.teams.reset();
  if (act === "del-team") {
    const n = Object.values(S.fixtures).filter(f => f.home === id || f.away === id).length;
    if (n) return toast(`${teamName(id)} has ${n} fixture${n > 1 ? "s" : ""}. Delete those first.`);
    if (!arm(b)) return;
    if (await commit(d => { delete d.teams[id]; delete d.contacts[id]; })) {
      toast("Team deleted");
      if ($("#team-form")?.dataset.id === id) VIEWS.teams.reset();
    }
  }
  if (act === "edit-venue") VIEWS.venues.edit(id);
  if (act === "cancel-venue") VIEWS.venues.reset();
  if (act === "del-venue") {
    const n = Object.values(S.teams).filter(t => t.venue === id).length;
    if (n) return toast(`${n} team${n > 1 ? "s use" : " uses"} this venue. Move ${n > 1 ? "them" : "it"} to another venue first.`);
    if (!arm(b)) return;
    if (await commit(d => { delete d.venues[id]; })) {
      toast("Venue deleted");
      if ($("#venue-form")?.dataset.id === id) VIEWS.venues.reset();
    }
  }
  if (act === "save-result") VIEWS["manage-fixtures"].saveResult(id, b.closest(".fx-admin"));
  if (act === "publish-night") { if (!arm(b, "Confirm: publish")) return; publishNight(b.dataset.date); }
  if (act === "fx-card") VIEWS["manage-fixtures"].scorecard(id);
  if (act === "fx-move") VIEWS["manage-fixtures"].move(id);
  if (act === "cup-card") VIEWS.cups.matchCard(id);
  if (act === "cup-final-card") VIEWS.cups.finalCard(id);
  if (act === "edit-fx") VIEWS["manage-fixtures"].edit(id);
  if (act === "cancel-fx") VIEWS["manage-fixtures"].reset();
  if (act === "del-fx") {
    if (!arm(b, "Confirm")) return;
    if (await commit(d => { delete d.fixtures[id]; })) toast("Fixture deleted");
  }
  if (act === "load-example") loadExample();
  if (act === "clear-all") { if (!arm(b, "Click again to delete everything")) return; clearAll(); }
});
document.addEventListener("change", e => { if (e.target.id === "season-pick") useSeason(e.target.value); });
window.addEventListener("hashchange", route);
// Pick up other people's changes when someone comes back to the tab.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - S.loadedAt > 60000) load();
});

/* ---------- boot ---------- */
async function boot() {
  Object.assign(S, { user: null, myLeagues: [], league: null, seasonId: null, admin: false, status: "connecting", version: 0,
    teams: {}, venues: {}, fixtures: {}, divisions: {}, cups: {}, transfers: {}, committee: {}, contacts: {}, news: [], adminNews: [], media: [], docs: [], addons: null, loaded: { teams: false, venues: false, fixtures: false } });
  S.token = store.get(TOKEN_KEY);
  S.slug = slugFromLocation();
  // A shared post's address, /<league>/news/<id>, opens that post on the league's site.
  const shared = /^\/[^/]+\/news\/([^/]+)\/?$/.exec(NAV.path());
  if (shared && S.slug) history.replaceState(null, "", `/${encodeURIComponent(S.slug)}#news/${shared[1]}`);
  S.mode = S.slug ? "league" : "account";
  if (S.mode === "account" && !S.token) return route();
  route();
  await loadMe();
  if (S.mode === "account") return route();
  await openLeague();
}
window.SKITTLERS_BOOT = boot;
boot();
</script>
