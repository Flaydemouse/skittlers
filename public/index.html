      <div class="actions"><button class="btn ghost" data-act="load-example">Load example season</button></div></div>`;
    const editing = $("#team-form").dataset.id;
    list.innerHTML = `<div class="cards">${teams.map(t => {
      const c = S.contacts[t.id] || {}, v = S.venues[t.venue], players = playersOf(t);
      const search = [t.name, v?.name, divisionName(t.division), fullName(captainOf(t)), ...players.map(playerLabel)].join(" ");
      return `<article class="card${t.id === editing ? " editing" : ""}" data-id="${esc(t.id)}" data-search="${esc(searchText(search))}">
        <div class="card-head"><div><h3><button type="button" class="card-toggle tn" data-act="toggle-team" data-id="${esc(t.id)}" aria-expanded="${this.open.has(t.id)}" aria-controls="tb-${esc(t.id)}">${esc(t.name)}</button></h3>
          <div class="sub">${divisionName(t.division) ? `${esc(divisionName(t.division))} · ` : ""}${v ? `${esc(v.name)}${v.alleys > 1 ? ` · Alley ${t.alley || 1}` : ""}` : "No home venue"} · ${players.length} player${players.length === 1 ? "" : "s"}</div></div>
          <div class="actions"><button class="btn ghost sm" data-act="edit-team" data-id="${esc(t.id)}">Edit</button><button class="btn danger sm" data-act="del-team" data-id="${esc(t.id)}">Delete</button></div></div>
        <div class="card-body" id="tb-${esc(t.id)}"${this.open.has(t.id) ? "" : " hidden"}><dl class="kv"><dt>Captain</dt><dd>${(() => { const cp = playersOf(t).find(p => p.captain); return cp ? playerHtml(cp) : esc(fullName(captainOf(t)) || "—"); })()}</dd>
          <dt>Vice captain</dt><dd>${viceOf(t) ? playerHtml(viceOf(t)) : "—"}</dd><dt>Sticker up</dt><dd>${stickerOf(t) ? playerHtml(stickerOf(t)) : "—"}</dd>
          <dt>Pairs Cup</dt><dd>${pairsOf(t).map(playerHtml).join(", ") || "—"}</dd>
          <dt>Email</dt><dd>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : "—"}</dd><dt>Mobile</dt><dd>${esc(c.mobile || "—")}</dd><dt>Address</dt><dd>${esc(c.address || "—")}</dd></dl>
        <div><div class="field"><span class="lbl">Players (${players.length})</span></div>
          <div class="tags">${players.map(p => `<span class="tag">${playerHtml(p)}${p.captain ? " (C)" : ""}${p.vice ? " (VC)" : ""}${p.sticker ? " (S)" : ""}${p.pairs ? " (P)" : ""}</span>`).join("") || `<span class="muted">No players listed</span>`}</div></div></div>
      </article>`;
    }).join("")}</div>`;
    this.filter();
  },
  // Teams start collapsed; the ones opened stay open while the page is in use.
  open: new Set(),
  toggle(id, show = !this.open.has(id)) {
    show ? this.open.add(id) : this.open.delete(id);
    const btn = $(`#team-list [data-act="toggle-team"][data-id="${CSS.escape(id)}"]`);
    if (btn) { btn.setAttribute("aria-expanded", show); document.getElementById("tb-" + id).hidden = !show; }
  },
  toggleAll(show) { for (const id of Object.keys(S.teams)) this.toggle(id, show); },
  filter() { applySearch($("#team-list"), S.ui.teamSearch, $("#team-count"), "team"); }
};

  importText: "",
  importSummary() {
    const out = $("#vimp-summary"), btn = $("#vimp-go");

    const plan = venueImportPlan(this.importText);

    if (plan.error) return out.innerHTML = `<p class="imp-problem">${esc(plan.error)}</p>`;
    const lines = [];
    if (plan.add.length) lines.push(`${plan.add.length} new venue${plan.add.length > 1 ? "s" : ""} to add.`);

    if (plan.same.length) lines.push(`${plan.same.length} already up to date.`);

    out.innerHTML = `<p class="lookup-note">${esc(lines.join(" "))}</p>` +
      (plan.problems.length ? `<p class="imp-problem">${plan.problems.length} row${plan.problems.length > 1 ? "s" : ""} will be skipped. Fix ${plan.problems.length > 1 ? "them" : "it"} in the file and import it again:</p>

  async importVenues() {
    const plan = venueImportPlan(this.importText);
    if (plan.error || !(plan.add.length + plan.update.length)) return;
    const btn = $("#vimp-go"); btn.disabled = true; btn.textContent = "Importing…";
    const lookups = [...plan.add.map(r => r.postcode), ...plan.update.map(u => u.changes.postcode)].filter(Boolean);
    const geo = await lookupPostcodes(lookups);
    let unmapped = 0;
    const where = pc => { const g = pc ? geo[pc] : null; if (pc && !g) unmapped++; return g ? { lat: g.lat, lng: g.lng } : { lat: null, lng: null }; };
    const ok = await commit(d => {
      for (const r of plan.add) {
        const id = newId() + Math.random().toString(36).slice(2, 5);
        d.venues[id] = { id, ...r, alleys: r.alleys || 1, ...where(r.postcode) };
      }
      for (const u of plan.update) {
        const v = d.venues[u.id]; if (!v) continue;
        if (!("address1" in v || "postcode" in v)) { Object.assign(v, venueAddr(v)); delete v.address; }

          <div><strong class="tn">${esc(t.name)}</strong><span class="muted">${v ? esc(v.name) : "No home venue"}</span></div>
          <label class="visually-hidden" for="dv-t-${esc(t.id)}">Division for ${esc(t.name)}</label>
          <select id="dv-t-${esc(t.id)}" data-team="${esc(t.id)}">${options}</select></div>`;
      }).join("")}</div></div>`;
    for (const t of teams) $(`#dv-t-${CSS.escape(t.id)}`).value = this.divisionOf(t);
    wireSearch($("#dv-search"), "dvSearch", () => this.filter());
    this.filter(); this.updateCounts();
  },
  filter() { const rows = $("#dv-rows"); if (rows) applySearch(rows, S.ui.dvSearch, $("#dv-count-shown"), "team", ".alloc-row"); },
  updateCounts() {
    const teams = sortedTeams(), divs = sortedDivisions(), count = {};
    for (const t of teams) { const d = this.divisionOf(t); count[d] = (count[d] || 0) + 1; }
    for (const d of divs) { const el = $(`[data-count="${CSS.escape(d.id)}"]`); if (el) el.textContent = plural(count[d.id] || 0, "team"); }
    const sum = $("#dv-summary");
    const shownName = d => $(`#dv-n-${CSS.escape(d.id)}`)?.value.trim() || d.name;
    if (sum) sum.innerHTML = divs.map(d => `<span class="chip">${esc(shownName(d))}: ${count[d.id] || 0}</span>`).join("") +
      `<span class="chip ${count[""] ? "warn" : "ok"}">Not in a division: ${count[""] || 0}</span>`;
    const changes = Object.keys(this.pending).length + $$("input[data-div][data-dirty]").filter(i => i.value.trim() !== divisionName(i.dataset.div)).length;
    $("#dv-bar").hidden = !changes;
    $("#dv-bar-text").textContent = `${plural(changes, "change")} not saved yet`;
  },
  async create(n) {
    if (!(n >= 1 && n <= 20)) return toast("Choose between 1 and 20 divisions.");
    const ok = await commit(d => {
      const ids = [];
      for (let i = 1; i <= n; i++) { const id = newId() + i; ids.push(id); d.divisions[id] = { id, name: `Division ${i}`, order: i }; }
      if (n === 1) for (const t of Object.values(d.teams)) t.division = ids[0];
    });
    if (ok) toast(n === 1 ? "Division 1 created, with every team in it" : `${n} divisions created. Now put each team in one.`);
  },
  async save() {
    const names = $$("input[data-div][data-dirty]").map(i => [i.dataset.div, i.value.trim()]);
    if (names.some(([, n]) => !n)) return toast("Give every division a name.");
    const lower = sortedDivisions().map(d => (names.find(([id]) => id === d.id)?.[1] ?? d.name).toLowerCase());
    if (new Set(lower).size !== lower.length) return toast("Two divisions have the same name. Give each a different name.");
    const pending = { ...this.pending };
    const ok = await commit(d => {
      for (const [id, name] of names) if (d.divisions[id]) d.divisions[id].name = name;
      for (const [tid, div] of Object.entries(pending)) { const t = d.teams[tid]; if (!t) continue; if (div) t.division = div; else delete t.division; }
    });
    if (ok) { this.pending = {}; $$("input[data-div]").forEach(i => delete i.dataset.dirty); this.refresh(); toast("Divisions saved"); }
  },
  undo() { this.pending = {}; $$("input[data-div]").forEach(i => delete i.dataset.dirty); this.refresh(); },
  async add() {
    const divs = sortedDivisions(), order = Math.max(0, ...divs.map(d => d.order || 0)) + 1;
    let n = divs.length + 1; while (divs.some(d => d.name.toLowerCase() === `division ${n}`)) n++;
    if (await commit(d => { const id = newId(); d.divisions[id] = { id, name: `Division ${n}`, order }; })) toast(`Division ${n} added`);
  },
  async remove(id) {
    const name = divisionName(id);
    if (await commit(d => { delete d.divisions[id]; for (const t of Object.values(d.teams)) if (t.division === id) delete t.division; })) {
      for (const [tid, v] of Object.entries(this.pending)) if (v === id) delete this.pending[tid];
      toast(`${name} deleted. Its teams are now not in a division.`);
    }
  },
  bulk() {
    const div = $("#dv-bulk").value; let n = 0;
    for (const t of sortedTeams()) if (!this.divisionOf(t)) { this.pending[t.id] = div; $(`#dv-t-${CSS.escape(t.id)}`).value = div; n++; }
    this.updateCounts();
    toast(n ? `${plural(n, "team")} put into ${divisionName(div)}. Press Save divisions to keep it.` : "Every team is already in a division.");
  }
};

    league: { id: S.league.id, name: S.league.name, slug: S.league.slug, settings: S.league.settings }, season,

}

/* ---------- example season & clearing ---------- */
async function loadExample() {
  if (S.busy) return;
  S.busy = true; toast("Loading example season…");
  const ok = await commit(d => {
    const vid = {}, div = newId() + "div";
    d.divisions[div] = { id: div, name: "Division 1", order: 1 };
    const V = [
      ["plough", "The Plough", 1, 2, "Taunton", "TA1 1AA", 51.0152, -3.1009],
      ["lion", "Red Lion", 2, 1, "Bridgwater", "TA6 3AA", 51.1283, -3.0035],
      ["crown", "Crown & Anchor", 3, 3, "Wellington", "TA21 8AA", 50.9786, -3.2265],
    ];
    for (const [key, name, n, alleys, town, postcode, lat, lng] of V) {
      const id = newId() + key;
      d.venues[id] = { id, name: `${name} (example)`, address1: `${n} Example Street`, address2: town, address3: "Somerset", postcode, lat, lng, phone: `01632 96000${n}`, alleys };
      vid[key] = id;
    }
    const T = [
      ["Plough Pinheads", "plough", 1], ["Ploughshares", "plough", 2], ["Lion Hearts", "lion", 1],
      ["Anchor Men", "crown", 1], ["Crown Jewels", "crown", 2], ["Sunday Spares", "crown", 3],
    ];
    const tid = T.map(([name, v, alley], i) => {
      const id = newId() + i;
      const surname = ["Ashby", "Brook", "Carter", "Dunn", "Ellis", "Fry"][i];
      d.teams[id] = { id, name: `${name} (example)`, division: div, venue: vid[v], alley, captainFirst: "Dave", captainLast: surname,
        players: ["Dave", "Sue", "Tom", "Jan", "Pete", "Liz", "Mark", "Kate"].map(first => ({ first, last: surname, nick: { Dave: "Tank", Liz: "Lucky" }[first] || "", ...roleFlags({ captain: first === "Dave", vice: first === "Tom", sticker: first === "Sue", pairs: first === "Pete" || first === "Liz" }) })) };
      d.contacts[id] = { email: `dave.${surname.toLowerCase()}@example.com`, address: `${i + 10} Example Close\nSomerset`, mobile: `07700 9000${i + 10}` };
      return id;
    });
    let seed = 7, k = 0;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    // Six of the team's players, each throwing six hands; about one hand in eight is a spare.
    const exampleCard = (team, shift) => ({ mode: "hands", rows: upTo(6).map(i => {
      const p = team.players[(i + shift) % team.players.length];
      const hands = [], spares = [];
      for (let h = 0; h < 6; h++) { const sp = rnd() < 0.12; spares.push(sp); hands.push(sp ? 9 + Math.floor(rnd() * 8) : 3 + Math.floor(rnd() * 7)); }
      return { key: searchText(fullName(p)), name: fullName(p), nick: p.nick || "", hands, spares, total: hands.reduce((a, b) => a + b, 0) };
    }) });
    const now = today();
    roundRobin(tid, true).forEach((pairs, r) => {
      const date = addDays("2026-09-10", r * 7);
      for (const [home, away] of pairs) {
        const id = newId() + "x" + k++, p = date < now;
        d.fixtures[id] = { id, comp: "league", round: null, date, time: "19:45", home, away, venue: null, alley: null, homePins: null, awayPins: null };
        if (p) {
          const cards = { home: exampleCard(d.teams[home], r), away: exampleCard(d.teams[away], r + 3) };
          Object.assign(d.fixtures[id], { cards, homePins: cardTotal(cards.home), awayPins: cardTotal(cards.away) });
        }
      }
    });
    // A six-team knockout cup: two byes, then semi-finals and a final. The first round has been played.
    const cid = newId() + "cup", draw = [tid[5], tid[0], tid[3], tid[1], tid[4], tid[2]];
    const cup = { id: cid, name: "League Cup (example)", type: "knockout", format: "team", structure: "full", entries: 6,
      entrants: tid.map(id => ({ id, label: d.teams[id].name })), draw, results: {}, schedule: {}, final: { scores: {} }, created: new Date().toISOString(),
      roundDates: { 1: { date: "2026-10-22", time: "19:45" }, 2: { date: "2026-11-26", time: "19:45" }, 3: { date: "2027-01-14", time: "19:45" } } };
    d.cups = { [cid]: cup };
    const saved = S.cups; S.cups = d.cups;
    const firstRound = cupBracket(cup).rounds[0].matches.filter(m => !m.bye);
    S.cups = saved;
    firstRound.forEach((m, i) => { cup.results[m.id] = { a: m.a, b: m.b, aPins: [301, 276][i], bPins: [288, 276][i], winner: i === 1 ? m.b : null }; });
  });
  S.busy = false;
  if (ok) toast("Example season loaded");
}

      const r = await send(`/api/super/users/${id}`, "PATCH", { resetPassword: true }), out = $(`#su-temp-${CSS.escape(id)}`);
      out.hidden = false; out.innerHTML = `Temporary password: <code>${esc(r.temporaryPassword)}</code>. Give it to ${esc(r.user.name)}; they can change it on their Account page.`;
    } catch (x) { saveError(x); }
  }
  if (act === "legacy-copy") {
    if (!arm(b, "Click again: replaces that season's data")) return;
    try { const r = await send("/api/super/legacy", "POST", { leagueId: $("#lgc-league").value, seasonId: $("#lgc-season").value }); toast(`Copied ${plural(r.copied.teams, "team")}, ${plural(r.copied.venues, "venue")} and ${plural(r.copied.fixtures, "fixture")}`); }
    catch (x) { saveError(x); }
  }
  if (act === "add-player") { $("#t-players").insertAdjacentHTML("beforeend", playerRow()); $("#t-players .player:last-child .p-first").focus(); }
  if (act === "rm-player") {
    const rows = $$("#t-players .player");
    if (rows.length > 1) b.closest(".player").remove();
    else { $$("input[type=text]", rows[0]).forEach(i => i.value = ""); $$("input[type=checkbox]", rows[0]).forEach(i => i.checked = false); $(".player-roles", rows[0]).hidden = true; }
    VIEWS.teams.checkDuplicates(); VIEWS.teams.showCaptain();
  }
  if (act === "edit-team") VIEWS.teams.edit(id);
  if (act === "bk-download") downloadBackup();
  if (act === "bk-restore") VIEWS["league-setup"].restoreCopy(id, b);
  if (act === "bk-restore-file") VIEWS["league-setup"].restoreFile(b);
  if (act === "toggle-team") VIEWS.teams.toggle(id);
  if (act === "teams-expand" || act === "teams-collapse") VIEWS.teams.toggleAll(act === "teams-expand");
  if (act === "cancel-team") VIEWS.teams.reset();
  if (act === "del-team") {
    const n = Object.values(S.fixtures).filter(f => f.home === id || f.away === id).length;
    if (n) return toast(`${teamName(id)} has ${n} fixture${n > 1 ? "s" : ""}. Delete those first.`);
    if (!arm(b)) return;
    if (await commit(d => { delete d.teams[id]; delete d.contacts[id]; })) {
      toast("Team deleted");
      if ($("#team-form")?.dataset.id === id) VIEWS.teams.reset();
    }
  }
  if (act === "edit-venue") VIEWS.venues.edit(id);
  if (act === "cancel-venue") VIEWS.venues.reset();
  if (act === "del-venue") {
    const n = Object.values(S.teams).filter(t => t.venue === id).length;
    if (n) return toast(`${n} team${n > 1 ? "s use" : " uses"} this venue. Move ${n > 1 ? "them" : "it"} to another venue first.`);
    if (!arm(b)) return;
    if (await commit(d => { delete d.venues[id]; })) {
      toast("Venue deleted");
      if ($("#venue-form")?.dataset.id === id) VIEWS.venues.reset();
    }
  }
  if (act === "save-result") VIEWS["manage-fixtures"].saveResult(id, b.closest(".fx-admin"));
  if (act === "fx-card") VIEWS["manage-fixtures"].scorecard(id);
  if (act === "fx-move") VIEWS["manage-fixtures"].move(id);
  if (act === "cup-card") VIEWS.cups.matchCard(id);
  if (act === "cup-final-card") VIEWS.cups.finalCard(id);
  if (act === "edit-fx") VIEWS["manage-fixtures"].edit(id);
  if (act === "cancel-fx") VIEWS["manage-fixtures"].reset();
  if (act === "del-fx") {
    if (!arm(b, "Confirm")) return;
    if (await commit(d => { delete d.fixtures[id]; })) toast("Fixture deleted");
  }
  if (act === "load-example") loadExample();
  if (act === "clear-all") { if (!arm(b, "Click again to delete everything")) return; clearAll(); }
});
document.addEventListener("change", e => { if (e.target.id === "season-pick") useSeason(e.target.value); });
window.addEventListener("hashchange", route);
// Pick up other people's changes when someone comes back to the tab.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - S.loadedAt > 60000) load();
});

/* ---------- boot ---------- */
async function boot() {
  Object.assign(S, { user: null, myLeagues: [], league: null, seasonId: null, admin: false, status: "connecting", version: 0,
    teams: {}, venues: {}, fixtures: {}, divisions: {}, cups: {}, contacts: {}, loaded: { teams: false, venues: false, fixtures: false } });
  S.token = store.get(TOKEN_KEY);
  S.slug = slugFromLocation();
  S.mode = S.slug ? "league" : "account";
  if (S.mode === "account" && !S.token) return route();
  route();
  await loadMe();
  if (S.mode === "account") return route();
  await openLeague();
}
window.SKITTLERS_BOOT = boot;
boot();
</script>
</body>
</html>
