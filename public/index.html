<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skittles League</title>
<meta name="description" content="League tables, league fixtures and cup fixtures.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='8' fill='%231D4533'/%3E%3Cg fill='%23F3F1E6'%3E%3Ccircle cx='22' cy='8' r='3.4'/%3E%3Ccircle cx='15' cy='15' r='3.4'/%3E%3Ccircle cx='29' cy='15' r='3.4'/%3E%3Ccircle cx='8' cy='22' r='3.4'/%3E%3Ccircle cx='36' cy='22' r='3.4'/%3E%3Ccircle cx='15' cy='29' r='3.4'/%3E%3Ccircle cx='29' cy='29' r='3.4'/%3E%3Ccircle cx='22' cy='36' r='3.4'/%3E%3C/g%3E%3Ccircle cx='22' cy='22' r='4.2' fill='%23B7842A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
/* Layout: a bottle-green pub-sign band holds the league name and tabs; below it, a paper page with tables and fixture cards. Admin views split into list + form. */
:root {
  --paper: #F2F5F1;
  --surface: #FFFFFF;
  --sunk: #E8EEE9;
  --ink: #17241E;
  --muted: #5A6B62;
  --line: #D3DCD5;
  --baize: #1D4533;
  --baize-2: #275A43;
  --on-baize: #F3F1E6;
  --on-baize-muted: #B9C9BE;
  --brass: #B7842A;
  --brass-ink: #855A0F;
  --win: #2C7448;
  --loss: #A43E36;
  --draw: #82661A;
  --warn-bg: #FBF0D9;
  --font-display: "Rokkitt", "Rockwell", "Georgia", serif;
  --font-body: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1512; --surface: #15201B; --sunk: #1B2822; --ink: #E5ECE7; --muted: #94A59B; --line: #2A3A31;
    --baize: #12301F; --baize-2: #1B412C; --on-baize: #F1EEDF; --on-baize-muted: #9DB4A5;
    --brass: #D6A447; --brass-ink: #E3B862; --win: #5DBB80; --loss: #E07A70; --draw: #D4B45A; --warn-bg: #3A2F14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1512; --surface: #15201B; --sunk: #1B2822; --ink: #E5ECE7; --muted: #94A59B; --line: #2A3A31;
  --baize: #12301F; --baize-2: #1B412C; --on-baize: #F1EEDF; --on-baize-muted: #9DB4A5;
  --brass: #D6A447; --brass-ink: #E3B862; --win: #5DBB80; --loss: #E07A70; --draw: #D4B45A; --warn-bg: #3A2F14;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
a { color: var(--brass-ink); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--baize); }
.wrap { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* Header band */
.band { background: var(--baize); color: var(--on-baize); }
.band .wrap { padding-block: 22px 0; }
.brand { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand > div:not(.acct) { min-width: 0; }
.acct { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: .92rem; }
.acct a, .acct button { color: var(--on-baize); background: none; border: 1px solid color-mix(in srgb, var(--on-baize) 35%, transparent); border-radius: 6px; padding: 6px 12px; font-weight: 600; text-decoration: none; cursor: pointer; }
.acct a:hover, .acct button:hover { background: var(--baize-2); }
.acct .who { color: var(--on-baize-muted); }
.brand svg { flex: none; }
.brand h1 { font-size: clamp(1.7rem, 4vw, 2.5rem); font-weight: 800; letter-spacing: .01em; }
.brand .season { color: var(--on-baize-muted); font-size: .95rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.tabs { display: flex; gap: 4px; margin-top: 18px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; color: var(--on-baize-muted); text-decoration: none; font-weight: 600; padding: 10px 14px; border-radius: var(--r) var(--r) 0 0; white-space: nowrap; }
.tabs a:hover { color: var(--on-baize); background: var(--baize-2); }
.tabs a[aria-current="page"] { background: var(--paper); color: var(--ink); }
.tabs .sep { flex: none; align-self: center; margin: 0 8px; color: var(--on-baize-muted); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
.tabs .end { margin-left: auto; }
.tabs button.end { flex: none; background: none; border: 0; color: var(--on-baize-muted); font-weight: 600; padding: 10px 14px; cursor: pointer; }
.tabs button.end:hover { color: var(--on-baize); }
.login { max-width: 420px; }

main { padding-block: 28px 64px; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
.view-head h2 { font-size: 1.9rem; font-weight: 800; }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.eyebrow { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--brass-ink); }

/* League table */
.division { margin-bottom: 32px; }
.division h3 { font-size: 1.35rem; margin-bottom: 10px; }
.table-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table.league { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 600px; }
.league th, .league td { padding: 10px 12px; text-align: right; white-space: nowrap; }
.league th { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; border-bottom: 2px solid var(--line); vertical-align: bottom; }
.league th abbr { text-decoration: none; cursor: help; }
/* Number columns are only as wide as their heading or figures; the team column takes the rest. */
.league th:not(.team), .league td:not(.team) { width: 1%; }
.league td { border-bottom: 1px solid var(--line); }
.league tr:last-child td { border-bottom: 0; }
.league .pos { text-align: center; width: 48px; font-weight: 700; color: var(--muted); }
.league tr:first-child .pos { color: var(--brass-ink); }
.league .team { text-align: left; font-weight: 600; white-space: normal; min-width: 180px; }
.league .pts { font-weight: 800; font-size: 1.05rem; background: var(--sunk); }
.league th.pts { background: var(--sunk); color: var(--ink); }
@media (max-width: 560px) {
  .league th, .league td { padding: 9px 6px; }
  .league .pos { width: 34px; }
  table.league { min-width: 100%; width: max-content; }
  .league .team { min-width: 0; }
  .league .team span { display: block; max-width: 128px; }
}
.neg { color: var(--loss); }
.pos-val { color: var(--win); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; color: var(--muted); font-size: .85rem; }
.legend b { color: var(--ink); font-weight: 600; }

/* Fixtures */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--baize); color: var(--on-baize); }
.date-group { margin-bottom: 22px; }
.date-group h3 { font-family: var(--font-body); font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.fx-list { display: grid; gap: 8px; }
.fx { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 4px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
.fx .home { text-align: right; font-weight: 600; min-width: 0; }
.fx .away { font-weight: 600; min-width: 0; }
.fx .score { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; text-align: center; min-width: 120px; }
.fx .score .v { color: var(--muted); font-weight: 500; font-size: .95rem; }
.fx .won { color: var(--win); }
.fx .meta { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: .85rem; }
.chip { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.chip.cup { background: var(--brass); color: var(--surface); }
.chip.warn { background: var(--warn-bg); color: var(--brass-ink); }
.round { margin-bottom: 26px; }
.round > h3 { font-size: 1.3rem; margin-bottom: 10px; }

/* Panels, forms, admin */
.split { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.split > * { min-width: 0; }
@media (max-width: 880px) { .split { grid-template-columns: minmax(0, 1fr); } .split .form-col { order: -1; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.panel + .panel { margin-top: 16px; }
.panel h3 { font-size: 1.25rem; margin-bottom: 14px; }
.form { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-size: .8rem; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.field .hint { font-size: .8rem; color: var(--muted); }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
input[type=text], input[type=email], input[type=password], input[type=tel], input[type=number], input[type=date], input[type=time], select, textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { border-color: var(--brass); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--brass) 30%, transparent); }
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 6px; padding: 9px 16px; font-weight: 600; cursor: pointer; background: var(--baize); color: var(--on-baize); }
.btn:hover { background: var(--baize-2); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--sunk); }
.btn.danger { background: transparent; color: var(--loss); border-color: var(--line); }
.btn.danger[data-armed] { background: var(--loss); color: var(--surface); border-color: var(--loss); }
.btn.sm { padding: 5px 10px; font-size: .85rem; }
.btn:disabled { opacity: .55; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.players { display: grid; gap: 8px; }
.player { display: grid; gap: 4px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.player-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
.player-row .btn { justify-self: end; align-self: center; }
.dup-note { color: var(--brass-ink); font-size: .82rem; font-weight: 700; }
.postcode { max-width: 11em; text-transform: uppercase; }
.lookup-note { font-size: .84rem; color: var(--muted); margin: 0; }
.lookup-note:empty { display: none; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.season-pick { margin-top: 4px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--baize-2); background: var(--baize-2); color: var(--on-baize); font-weight: 600; letter-spacing: .04em; max-width: 100%; }
.auth { max-width: 460px; }
.auth .panel { display: grid; gap: 12px; }
.auth-foot { margin-top: 14px; }
.slug-row { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); overflow: hidden; }
.slug-row:focus-within { border-color: var(--brass); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brass) 30%, transparent); }
.slug-pre { display: flex; align-items: center; padding: 0 2px 0 11px; color: var(--muted); white-space: nowrap; font-size: .9rem; }
.slug-row input { border: 0 !important; box-shadow: none !important; background: transparent; padding-left: 0; }
.checks { display: grid; gap: 6px; margin-top: 6px; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.chip.ok { background: color-mix(in srgb, var(--win) 16%, transparent); color: var(--win); }
.steps { list-style: none; margin: 0 0 22px; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; counter-reset: step; }
.steps a { display: flex; gap: 10px; align-items: flex-start; height: 100%; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); text-decoration: none; }
.steps a:hover { border-color: var(--brass); }
.steps .tick { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .75rem; font-weight: 800; color: var(--surface); }
.steps .done .tick { background: var(--win); border-color: var(--win); }
.steps strong { display: block; }
.steps a > span:last-child span { display: block; font-size: .84rem; color: var(--muted); }
.div-list { display: grid; gap: 8px; }
.div-row { display: grid; grid-template-columns: minmax(0, 420px) auto auto; justify-content: start; gap: 10px; align-items: center; }
.dv-start { max-width: 460px; }
.dv-summary { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.dv-bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; font-size: .9rem; }
.dv-bulk select { width: auto; }
.alloc { display: grid; border-top: 1px solid var(--line); }
.alloc-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 220px); gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.alloc-row strong { display: block; overflow-wrap: anywhere; }
.alloc-row .muted { font-size: .84rem; }
#dv-alloc { margin-top: 16px; }
.save-bar { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: var(--r); background: var(--ink); color: var(--paper); box-shadow: 0 6px 20px rgb(0 0 0 / .25); }
.save-bar .btn.ghost { color: var(--paper); border-color: color-mix(in srgb, var(--paper) 40%, transparent); }
.save-bar .btn.ghost:hover { background: color-mix(in srgb, var(--paper) 12%, transparent); }
.sub-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.sub-row .field { flex: 0 1 160px; }
.temp-pass { margin: 0; padding: 10px 12px; border-radius: 6px; background: var(--warn-bg); font-size: .9rem; overflow-wrap: anywhere; }
.division.loose h3 { color: var(--muted); }
body:has(.save-bar:not([hidden])) .toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.list-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.list-tools input[type=search] { flex: 1 1 240px; width: auto; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; }
.list-tools input[type=search]:focus { border-color: var(--brass); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--brass) 30%, transparent); }
.list-count { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.imp-summary { display: grid; gap: 6px; }
.imp-summary:empty { display: none; }
.imp-problem { margin: 0; font-size: .84rem; font-weight: 700; color: var(--loss); }
.imp-problems { margin: 0; padding-left: 18px; font-size: .84rem; color: var(--ink); display: grid; gap: 2px; }
.map { position: relative; z-index: 0; height: 190px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--sunk); }
.map-note { display: grid; place-items: center; height: 100%; padding: 12px; text-align: center; color: var(--muted); font-size: .85rem; }
.map-off .map-note { position: absolute; inset: 0; z-index: 1000; background: var(--sunk); }
.map a { color: var(--brass-ink); }
.pin { background: var(--brass); border: 3px solid #fff; border-radius: 50%; box-shadow: 0 1px 4px rgb(0 0 0 / .45); }
.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.card.editing { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
.card-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; flex-wrap: wrap; }
.card-head h3 { font-size: 1.25rem; }
.card-head .sub { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: .92rem; margin: 0; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: var(--sunk); border-radius: 999px; padding: 2px 10px; font-size: .85rem; }
.alley-grid { display: grid; gap: 6px; }
.alley-row { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px; font-size: .92rem; }
.alley-row .n { font-weight: 700; color: var(--brass-ink); }
.assign-row { display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: 10px; align-items: center; }

.fx-admin { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.fx-admin.editing { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
.fx-admin .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .85rem; color: var(--muted); grid-column: 1 / -1; }
.result-line { display: grid; grid-template-columns: minmax(0,1fr) 78px 12px 78px minmax(0,1fr); gap: 8px; align-items: center; }
.result-line .h { text-align: right; font-weight: 600; overflow-wrap: anywhere; }
.result-line .a { font-weight: 600; overflow-wrap: anywhere; }
.result-line input { text-align: center; padding: 7px 4px; font-variant-numeric: tabular-nums; }
.result-line .dash { text-align: center; color: var(--muted); }
@media (max-width: 560px) {
  .fx-admin { grid-template-columns: minmax(0, 1fr); }
  .result-line { grid-template-columns: minmax(0,1fr) 64px; }
  .result-line .h { text-align: left; }
  .result-line .dash { display: none; }
  .fx { grid-template-columns: minmax(0,1fr); text-align: center; }
  .fx .home, .fx .away { text-align: center; }
}

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 6px; }
.empty .actions { justify-content: center; margin-top: 14px; }
.notice { background: var(--warn-bg); color: var(--ink); border-radius: var(--r); padding: 12px 16px; margin-bottom: 18px; font-size: .92rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: var(--r); font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
.muted { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .btn, .tabs a, .seg button { transition: background .15s, color .15s; } }
</style>
</head>
<body>

<header class="band">
  <div class="wrap">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <g fill="var(--on-baize)">
          <circle cx="22" cy="6" r="3.4"/>
          <circle cx="15" cy="13" r="3.4"/><circle cx="29" cy="13" r="3.4"/>
          <circle cx="8" cy="20" r="3.4"/><circle cx="36" cy="20" r="3.4"/>
          <circle cx="15" cy="27" r="3.4"/><circle cx="29" cy="27" r="3.4"/>
          <circle cx="22" cy="34" r="3.4"/>
        </g>
        <circle cx="22" cy="20" r="4.2" fill="var(--brass)"/>
      </svg>
      <div>
        <h1 id="league-name">Skittlers</h1>
        <div class="season" id="league-season"></div>
      </div>
      <div class="acct" id="acct"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>

<main class="wrap" id="main" aria-live="polite"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => (v === "" || v == null || !Number.isFinite(+v)) ? null : Math.round(+v);

const DEFAULT_POINTS = { win: 2, draw: 1, loss: 0 };
const S = {
  token: null, user: null, myLeagues: [],
  mode: "account", slug: null, league: null, seasonId: null,
  admin: false, status: "connecting", version: 0, loadedAt: 0,
  teams: {}, venues: {}, fixtures: {}, divisions: {}, contacts: {},
  loaded: { teams: false, venues: false, fixtures: false },
  ui: { fxTeam: "", fxShow: "upcoming", adminComp: "all", adminShow: "open" },
  busy: false,
};
const currentSeason = () => S.league?.seasons.find(s => s.id === S.seasonId) || null;
const cfg = () => ({ ...DEFAULT_POINTS, ...(S.league?.settings || {}), name: S.league?.name || "Skittlers", season: currentSeason()?.name || "" });
const ready = () => S.loaded.teams && S.loaded.venues && S.loaded.fixtures;
const canEdit = () => S.admin && !!S.user?.canEdit;

/* ---------- helpers ---------- */
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3600);
}
function arm(btn, label = "Click again to confirm") {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = "1"; btn.dataset.orig = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 3500);
  return false;
}
const teamName = id => S.teams[id]?.name || "Unknown team";
const sortedTeams = () => Object.values(S.teams).sort((a, b) => a.name.localeCompare(b.name));
const sortedVenues = () => Object.values(S.venues).sort((a, b) => a.name.localeCompare(b.name));
const sortedDivisions = () => Object.values(S.divisions).sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name, undefined, { numeric: true }));
const divisionName = id => S.divisions[id]?.name || "";
const played = f => Number.isFinite(f.homePins) && Number.isFinite(f.awayPins);
const fxSort = (a, b) => (a.date || "").localeCompare(b.date || "") || (a.time || "").localeCompare(b.time || "") || teamName(a.home).localeCompare(teamName(b.home));
function fxVenue(f) {
  const vid = f.venue || S.teams[f.home]?.venue;
  const v = S.venues[vid];
  const alley = f.alley || (vid && vid === S.teams[f.home]?.venue ? S.teams[f.home]?.alley : null);
  return { v, alley: v && v.alleys > 1 ? alley : null, vid };
}
function fmtDate(d, long) {
  if (!d) return "Date to be set";
  const dt = new Date(d + "T12:00:00");
  return dt.toLocaleDateString("en-GB", long ? { weekday: "long", day: "numeric", month: "long", year: "numeric" } : { weekday: "short", day: "numeric", month: "short" });
}
const dayMonthYear = d => d ? new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : "";
const today = () => new Date().toISOString().slice(0, 10);
const signed = n => n > 0 ? `+${n}` : String(n);
const cls = n => n > 0 ? "pos-val" : n < 0 ? "neg" : "";
const newId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const slugify = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
  .replace(/&/g, " and ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40).replace(/-+$/, "");
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

/* ---------- addresses: the account area is "/", each league is "/<slug>" (or <slug>.skittlers.co.uk) ---------- */
// The in-browser preview replaces NAV so it can switch pages without real addresses.
const NAV = window.SKITTLERS_NAV || {
  path: () => location.pathname,
  go: (path, hash) => location.assign(path + (hash ? "#" + hash : "")),
};
function slugFromLocation() {
  const sub = /^([a-z0-9-]+)\.skittlers\.co\.uk$/i.exec(location.hostname);
  if (sub && sub[1].toLowerCase() !== "www") return sub[1].toLowerCase();
  const seg = NAV.path().split("/").filter(Boolean)[0];
  return seg ? decodeURIComponent(seg).toLowerCase() : null;
}
const leaguePath = slug => `/${slug}`;
const SITE_HOST = window.SKITTLERS_HOST || location.host || "skittlers.co.uk";
const leagueAddress = slug => `${SITE_HOST}/${slug}`;
const accountLink = (hash, label, extra = "") => `<a href="/#${hash}" data-path="/" data-hash="${hash}"${extra}>${label}</a>`;
const leagueLink = (slug, hash, label, extra = "") => `<a href="${leaguePath(slug)}${hash ? "#" + hash : ""}" data-path="${leaguePath(slug)}" data-hash="${hash || ""}"${extra}>${label}</a>`;

/* ---------- data ---------- */
const TOKEN_KEY = "skittlers-token";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
};
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "content-type": "application/json", ...(S.token ? { authorization: `Bearer ${S.token}` } : {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || "Something went wrong"), { status: res.status, body });
  return body;
}
const send = (path, method, body) => api(path, { method, body: JSON.stringify(body || {}) });
function setToken(token) { S.token = token; store.set(TOKEN_KEY, token); }
async function loadMe() {
  if (!S.token) return;
  try {
    const [{ user }, { leagues }] = await Promise.all([api("/api/auth/me"), api("/api/my/leagues")]);
    S.user = user; S.myLeagues = leagues;
  } catch (e) {
    if (e.status === 401) { setToken(null); S.user = null; S.myLeagues = []; }
  }
}
function signedOut(msg) {
  setToken(null); S.user = null; S.myLeagues = []; S.admin = false; S.contacts = {};
  if (msg) toast(msg);
  if (S.mode === "league") { if (ADMIN_VIEWS.some(([id]) => id === location.hash.slice(1))) location.hash = "tables"; route(); loadSeason(); }
  else { location.hash = "login"; route(); }
}
function apply(d) {
  S.version = d.version || 0;
  S.teams = d.teams || {}; S.venues = d.venues || {}; S.fixtures = d.fixtures || {}; S.divisions = d.divisions || {};
  if (d.contacts) S.contacts = d.contacts;
  S.loaded = { teams: true, venues: true, fixtures: true };
  S.status = "live"; S.loadedAt = Date.now();
  refresh();
}
const seasonPref = () => `skittlers-season-${S.league?.id}`;
async function openLeague() {
  try { S.league = (await api(`/api/public/${encodeURIComponent(S.slug)}`)).league; }
  catch (e) { S.status = e.status === 404 ? "missing" : "offline"; return route(); }
  S.admin = !!S.user && (S.user.isSuper || S.myLeagues.some(l => l.id === S.league.id));
  const remembered = S.admin && store.get(seasonPref());
  S.seasonId = S.league.seasons.some(s => s.id === remembered) ? remembered : S.league.currentSeasonId || S.league.seasons.at(-1)?.id || null;
  route();
  await loadSeason();
}
async function loadSeason() {
  if (!S.league) return;
  if (!S.seasonId) return apply({});
  try {
    apply(await api(S.admin ? `/api/leagues/${S.league.id}/seasons/${S.seasonId}` : `/api/public/${encodeURIComponent(S.league.slug)}/seasons/${S.seasonId}`));
  } catch (e) {
    if (e.status === 401 && S.admin) return signedOut("Your login has ended. Log in again.");
    S.status = "offline"; refresh();
  }
}
const load = () => S.mode === "league" ? loadSeason() : loadMe().then(refresh);
function useSeason(id) {
  S.seasonId = id; store.set(seasonPref(), id);
  S.status = "connecting"; S.loaded = { teams: false, venues: false, fixtures: false };
  refresh(); loadSeason();
}
function saveError(e) {
  if (e.status === 401) signedOut("Your login has ended. Log in again.");
  else toast(e.status ? e.message : "Couldn't save. Check your connection and try again.");
}
// Every change sends the whole season back with the version it was based on.
// If someone else saved in between, the server refuses (409) and we reload their version.
async function commit(mutate) {
  if (!S.seasonId) { toast("Set up a season first, on the Seasons page."); return false; }
  const draft = structuredClone({ teams: S.teams, venues: S.venues, fixtures: S.fixtures, divisions: S.divisions, contacts: S.contacts });
  mutate(draft);
  const { contacts, ...data } = draft;
  try {
    apply(await send(`/api/leagues/${S.league.id}/seasons/${S.seasonId}`, "PUT", { version: S.version, data, contacts }));
    return true;
  } catch (e) {
    if (e.status === 409) { apply(e.body); toast("Someone else saved changes just now. The page has been updated, so make your change again."); }
    else saveError(e);
    return false;
  }
}
// League-level changes: name, web address, points, seasons.
async function leagueRequest(path, method, body) {
  try { const r = await send(`/api/leagues/${S.league.id}${path}`, method, body); if (r.league) S.league = r.league; return r; }
  catch (e) { saveError(e); return null; }
}

function clashes() {
  const seen = {}, out = new Set();
  for (const f of Object.values(S.fixtures)) {
    if (!f.date) continue;
    const { vid, alley } = fxVenue(f);
    if (!vid) continue;
    const k = `${f.date}|${vid}|${alley || 1}`;
    (seen[k] ||= []).push(f.id);
  }
  Object.values(seen).forEach(ids => ids.length > 1 && ids.forEach(id => out.add(id)));
  return out;
}

/* ---------- standings ---------- */
// Returns [{division, rows}] in division order. Teams not yet in a division come last, for admins only.
function standings() {
  const c = cfg(), rows = {};
  for (const t of Object.values(S.teams)) rows[t.id] = { t, P: 0, W: 0, D: 0, L: 0, hp: 0, ap: 0, pf: 0, pa: 0, apd: 0 };
  for (const f of Object.values(S.fixtures)) {
    if (f.comp !== "league" || !played(f)) continue;
    const h = rows[f.home], a = rows[f.away];
    if (!h || !a) continue;
    const hp = f.homePins, ap = f.awayPins;
    h.P++; a.P++;
    h.hp += hp; a.ap += ap;
    h.pf += hp; h.pa += ap; a.pf += ap; a.pa += hp;
    a.apd += ap - hp;
    if (hp > ap) { h.W++; a.L++; } else if (hp < ap) { a.W++; h.L++; } else { h.D++; a.D++; }
  }
  for (const r of Object.values(rows)) { r.pd = r.pf - r.pa; r.pts = r.W * c.win + r.D * c.draw + r.L * c.loss; }
  const order = (a, b) => b.pts - a.pts || b.pd - a.pd || b.apd - a.apd || a.t.name.localeCompare(b.t.name);
  const all = Object.values(rows);
  const divs = sortedDivisions();
  if (!divs.length) return all.length ? [{ division: null, rows: all.sort(order) }] : [];
  const groups = divs.map(d => ({ division: d, rows: all.filter(r => r.t.division === d.id).sort(order) })).filter(g => g.rows.length);
  const loose = all.filter(r => !S.divisions[r.t.division]);
  if (loose.length && S.admin) groups.push({ division: { name: "Not in a division yet" }, loose: true, rows: loose.sort(order) });
  return groups;
}

/* ---------- shell & routing ---------- */
const PUBLIC_VIEWS = [["tables", "League tables"], ["fixtures", "League fixtures"], ["cup", "Cup fixtures"]];
const ADMIN_VIEWS = [["seasons", "Seasons"], ["venues", "Venues"], ["teams", "Teams"], ["divisions", "Divisions"], ["manage-fixtures", "Fixtures & results"], ["league-setup", "League setup"]];
const ACCOUNT_VIEWS = [["leagues", "My leagues"], ["account", "Account"]];
let current = null;

function renderNav() {
  const v = currentView();
  const link = ([id, label]) => `<a href="#${id}"${id === v ? ' aria-current="page"' : ""}>${label}</a>`;
  const logout = `<button type="button" data-act="logout">Log out</button>`;
  if (S.mode === "account") {
    $("#tabs").innerHTML = S.user
      ? ACCOUNT_VIEWS.map(link).join("") + (S.user.isSuper ? link(["super", "Overall admin"]) : "")
      : link(["login", "Log in"]) + link(["signup", "Sign up"]);
    $("#acct").innerHTML = S.user ? logout : "";
    return;
  }
  if (!S.league) { $("#tabs").innerHTML = ""; $("#acct").innerHTML = ""; return; }
  $("#tabs").innerHTML = PUBLIC_VIEWS.map(link).join("") + (S.admin ? `<span class="sep">Admin</span>` + ADMIN_VIEWS.map(link).join("") : "");
  $("#acct").innerHTML = S.admin
    ? `<span class="who">${esc(S.user.name)}</span>${accountLink("leagues", "My leagues")}${logout}`
    : `<a href="/#login" data-act="secretary-login">Secretary login</a>`;
}
function renderBrand() {
  const name = $("#league-name"), sub = $("#league-season");
  if (S.mode === "account") {
    document.title = "Skittlers";
    name.textContent = "Skittlers";
    sub.textContent = S.user ? `Logged in as ${S.user.name}` : "League websites for skittles";
    return;
  }
  if (!S.league) { name.textContent = S.status === "missing" ? "League not found" : "Skittlers"; sub.textContent = ""; return; }
  document.title = S.league.name;
  name.textContent = S.league.name;
  const seasons = [...S.league.seasons].reverse();
  if (!seasons.length) { sub.textContent = S.admin ? "No season set up yet" : ""; return; }
  if (seasons.length === 1) { sub.textContent = `Season ${seasons[0].name}`; return; }
  const sel = sub.querySelector("select");
  const opts = seasons.map(s => `<option value="${esc(s.id)}"${s.id === S.seasonId ? " selected" : ""}>Season ${esc(s.name)}${S.admin && s.id === S.league.currentSeasonId ? " (on public site)" : ""}</option>`).join("");
  if (!sel || sel.dataset.opts !== opts) {
    sub.innerHTML = `<label class="visually-hidden" for="season-pick">Season</label><select id="season-pick" class="season-pick" data-opts="">${opts}</select>`;
    $("#season-pick").dataset.opts = opts;
  }
}
function currentView() {
  const h = location.hash.slice(1);
  if (S.mode === "account") {
    if (!S.user) return h === "signup" ? "signup" : "login";
    if (ACCOUNT_VIEWS.some(([id]) => id === h) || (h === "super" && S.user.isSuper)) return h;
    return "leagues";
  }
  if (!S.league) return "league-status";
  if (PUBLIC_VIEWS.some(([id]) => id === h)) return h;
  if (S.admin && ADMIN_VIEWS.some(([id]) => id === h)) return h;
  if (S.admin && !S.league.seasons.length) return "seasons";
  return "tables";
}
function route() {
  const v = currentView();
  renderNav();
  current = VIEWS[v];
  $("#main").innerHTML = "";
  dropMaps();
  if (S.mode === "league" && S.admin && S.user && !S.user.canEdit)
    $("#main").insertAdjacentHTML("beforeend", `<div class="notice" role="note">${esc(subscriptionNote(S.user))}</div>`);
  const el = document.createElement("div");
  $("#main").append(el);
  current.mount(el);
  refresh();
}
function refresh() {
  renderBrand();
  current?.refresh();
}
function subscriptionNote(u) {
  const s = u.subscription || {}, when = dayMonthYear(s.until);
  if (u.isSuper) return "You're the overall admin, so there's no subscription to pay.";
  if (!u.canEdit) return `Your subscription ended on ${when}. You can still view your leagues, but changes are paused until it's renewed. Contact the site owner to renew.`;
  return s.status === "trial" ? `Free trial until ${when}. A yearly subscription keeps your leagues running after that.` : `Subscription paid until ${when}.`;
}
function statusBlock() {
  if (S.status === "missing") return `<div class="empty"><strong>There's no league at this address</strong>Check the address, or ${accountLink("leagues", "go to your leagues")}.</div>`;
  if (S.status === "offline") return `<div class="empty"><strong>Couldn't load the league data</strong>Check your connection and refresh the page.</div>`;
  if (S.league && !S.seasonId) return `<div class="empty"><strong>No season yet</strong>${S.admin ? `Set up the first season on the <a href="#seasons">Seasons</a> page.` : "This league's first season hasn't been set up yet."}</div>`;
  if (S.status === "connecting" || !ready()) return `<div class="empty"><strong>Loading league data…</strong></div>`;
  return null;
}
function noTeamsBlock() {
  return `<div class="empty"><strong>No teams yet</strong>${S.admin
    ? `Add venues and teams in the admin area, or load an example season to see how it works.
       <div class="actions"><a class="btn" href="#venues">Add venues</a><a class="btn ghost" href="#teams">Add teams</a><button class="btn ghost" data-act="load-example">Load example season</button></div>`
    : "The league secretary hasn't added this season's teams yet."}</div>`;
}

const VIEWS = {};
VIEWS["league-status"] = { mount(el) { el.innerHTML = `<div id="ls-body"></div>`; }, refresh() { $("#ls-body").innerHTML = statusBlock() || ""; } };

/* ---------- account area: log in & sign up ---------- */
const AFTER_LOGIN = "skittlers-after-login";
async function afterLogin({ token, user }) {
  setToken(token); S.user = user;
  await loadMe();
  let next = null; try { next = JSON.parse(sessionStorage.getItem(AFTER_LOGIN)); sessionStorage.removeItem(AFTER_LOGIN); } catch {}
  if (next?.path && next.path !== "/") return NAV.go(next.path, next.hash || "teams");
  location.hash = "leagues"; route();
}
function authForm(el, { title, intro, fields, button, endpoint, footer }) {
  el.innerHTML = `<div class="auth">
    <div class="view-head"><div><div class="eyebrow">Skittlers</div><h2>${title}</h2><p>${intro}</p></div></div>
    <form class="panel form" id="auth-form" autocomplete="on" novalidate>
      ${fields}
      <p class="imp-problem" id="auth-error" hidden></p>
      <div class="actions"><button class="btn" type="submit" id="auth-go">${button}</button></div>
    </form>
    <p class="muted auth-foot">${footer}</p></div>`;
  $("#auth-form").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("#auth-go"), err = $("#auth-error");
    btn.disabled = true; err.hidden = true;
    const body = Object.fromEntries($$("input", e.target).map(i => [i.name, i.value]));
    try { await afterLogin(await send(endpoint, "POST", body)); }
    catch (x) { err.textContent = x.status ? x.message : "Couldn't reach the server. Try again."; err.hidden = false; }
    finally { if (btn.isConnected) btn.disabled = false; }
  });
  $("input", el).focus();
}
VIEWS.login = {
  mount(el) {
    authForm(el, {
      title: "Log in", intro: "League secretaries log in here to manage their leagues.", button: "Log in", endpoint: "/api/auth/login",
      fields: `<div class="field"><label for="a-email">Email</label><input type="email" id="a-email" name="email" autocomplete="email" required></div>
        <div class="field"><label for="a-pass">Password</label><input type="password" id="a-pass" name="password" autocomplete="current-password" required></div>`,
      footer: `No account yet? <a href="#signup">Sign up</a>. Forgotten your password? Contact the site owner to reset it.`,
    });
  },
  refresh() {}
};
VIEWS.signup = {
  mount(el) {
    authForm(el, {
      title: "Create your account", intro: "Set up websites for your skittles leagues: tables, fixtures, teams and venues. Start with a free 30-day trial, then it's a yearly subscription.",
      button: "Create account", endpoint: "/api/auth/signup",
      fields: `<div class="field"><label for="a-name">Your name</label><input type="text" id="a-name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="a-email">Email</label><input type="email" id="a-email" name="email" autocomplete="email" required></div>
        <div class="field"><label for="a-pass">Password</label><input type="password" id="a-pass" name="password" autocomplete="new-password" minlength="8" required><span class="hint">At least 8 characters.</span></div>`,
      footer: `Already have an account? <a href="#login">Log in</a>.`,
    });
  },
  refresh() {}
};

/* ---------- account area: my leagues ---------- */
VIEWS.leagues = {
  mount(el) {
    el.innerHTML = `<div class="view-head"><div><div class="eyebrow">Your account</div><h2>${S.user.isSuper ? "All leagues" : "My leagues"}</h2>
      <p id="lg-sub"></p></div></div>
      <div class="split">
        <div id="lg-list"></div>
        <div class="form-col"><form class="panel form" id="lg-form" autocomplete="off">
          <h3>Create a league</h3>
          <p class="muted" style="margin:0">Name your league, then you'll set up its first season, venues, teams and divisions.</p>
          <div class="field"><label for="lg-name">League name</label><input type="text" id="lg-name" maxlength="80" required></div>
          <div class="field"><label for="lg-slug">Web address</label>
            <div class="slug-row"><span class="slug-pre" id="lg-pre"></span><input type="text" id="lg-slug" maxlength="40" spellcheck="false" autocapitalize="off"></div>
            <span class="lookup-note" id="lg-slug-note"></span></div>
          <div class="actions"><button class="btn" type="submit" id="lg-go">Create league</button></div>
        </form></div>
      </div>`;
    $("#lg-pre").textContent = `${SITE_HOST}/`;
    const name = $("#lg-name"), slug = $("#lg-slug");
    name.addEventListener("input", () => { if (!slug.dataset.edited) { slug.value = slugify(name.value); checkSlug(slug, $("#lg-slug-note")); } });
    slug.addEventListener("input", () => { slug.dataset.edited = "1"; slug.value = slug.value.toLowerCase(); checkSlug(slug, $("#lg-slug-note")); });
    $("#lg-form").addEventListener("submit", async e => {
      e.preventDefault();
      if (!name.value.trim()) return toast("Give the league a name.");
      $("#lg-go").disabled = true;
      try {
        const { league } = await send("/api/leagues", "POST", { name: name.value, slug: slug.value });
        NAV.go(leaguePath(league.slug), "seasons");
      } catch (x) { saveError(x); }
      finally { if ($("#lg-go")) $("#lg-go").disabled = false; }
    });
  },
  refresh() {
    $("#lg-sub").textContent = subscriptionNote(S.user);
    $("#lg-go").disabled = !S.user.canEdit;
    const list = $("#lg-list");
    if (!S.myLeagues.length) return list.innerHTML = `<div class="empty"><strong>No leagues yet</strong>Create your first league with the form.</div>`;
    list.innerHTML = `<div class="cards">${[...S.myLeagues].sort((a, b) => a.name.localeCompare(b.name)).map(l => {
      const cur = l.seasons.find(s => s.id === l.currentSeasonId);
      return `<article class="card">

// Checks a web address as it's typed, after a short pause.
function checkSlug(input, note, leagueId) {
  clearTimeout(checkSlug.t);
  const v = input.value.trim();

  note.textContent = "Checking…";
  checkSlug.t = setTimeout(async () => {
    try {
      const r = await api(`/api/slug-check?slug=${encodeURIComponent(v)}${leagueId ? `&league=${leagueId}` : ""}`);
      if (input.value.trim() === v) note.textContent = r.available ? `Available. Later this will also be ${v}.skittlers.co.uk` : r.reason;

}

// Hides cards that don't contain every word typed, and reports how many are showing.
function applySearch(list, query, countEl, noun, selector = ".card") {

/* ---------- names & addresses ---------- */
function splitName(s) {
  const t = String(s || "").trim().replace(/\s+/g, " "), i = t.indexOf(" ");
  return i < 0 ? { first: t, last: "" } : { first: t.slice(0, i), last: t.slice(i + 1) };
}
const fullName = p => [p.first, p.last].filter(Boolean).join(" ");
// Only a full first + last name counts when looking for duplicates.
const nameKey = p => p.first && p.last ? `${p.first} ${p.last}`.toLowerCase().replace(/\s+/g, " ").trim() : null;
// Older records stored single strings; read them in the new shape.
const captainOf = t => ("captainFirst" in t || "captainLast" in t) ? { first: t.captainFirst || "", last: t.captainLast || "" } : splitName(t.captain);
const playersOf = t => (t.players || []).map(p => typeof p === "string" ? { ...splitName(p), nick: "" } : { first: p.first || "", last: p.last || "", nick: p.nick || "" });
// e.g. John “Smithy” Smith
const playerLabel = p => [p.first, p.nick && `“${p.nick}”`, p.last].filter(Boolean).join(" ");
function venueAddr(v) {
  if ("address1" in v || "postcode" in v) return { address1: v.address1 || "", address2: v.address2 || "", address3: v.address3 || "", postcode: v.postcode || "" };
  const lines = String(v.address || "").split("\n").map(s => s.trim()).filter(Boolean);
  return { address1: lines[0] || "", address2: lines[1] || "", address3: lines.slice(2).join(", "), postcode: "" };
}
const addrText = a => [a.address1, a.address2, a.address3, a.postcode].filter(Boolean).join("\n");

/* ---------- postcodes & maps ---------- */
const POSTCODE_RE = /^([A-Z]{1,2}\d[A-Z\d]?)\s*(\d[A-Z]{2})$/i;
function normPostcode(s) { const m = POSTCODE_RE.exec(String(s || "").trim()); return m ? `${m[1]} ${m[2]}`.toUpperCase() : null; }
const geoCache = {};
// Resolves {lat, lng}, null when the postcode doesn't exist, or undefined when the lookup service can't be reached.
async function lookupPostcode(pc) {
  if (pc in geoCache) return geoCache[pc];
  try {
    const res = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(pc)}`);
    if (res.status === 404) return geoCache[pc] = null;
    if (!res.ok) return undefined;
    const { result } = await res.json();
    return geoCache[pc] = result ? { lat: result.latitude, lng: result.longitude } : null;
  } catch { return undefined; }
}
// Looks up many postcodes in one go (postcodes.io takes up to 100 per request).
async function lookupPostcodes(list) {
  const todo = [...new Set(list)].filter(pc => !(pc in geoCache));
  for (let i = 0; i < todo.length; i += 100) {
    try {
      const res = await fetch("https://api.postcodes.io/postcodes", {
        method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ postcodes: todo.slice(i, i + 100) }),
      });
      if (!res.ok) continue;
      for (const { query, result } of (await res.json()).result || [])
        geoCache[normPostcode(query) || query] = result ? { lat: result.latitude, lng: result.longitude } : null;
    } catch {}
  }
  return Object.fromEntries(list.map(pc => [pc, geoCache[pc]]));
}

// Reads CSV text into rows of trimmed cells, handling quoted cells with commas or line breaks.
function parseCsv(text) {
  const rows = []; let row = [], cell = "", quoted = false;
  text = String(text).replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c !== '"') cell += c;
      else if (text[i + 1] === '"') { cell += '"'; i++; }
      else quoted = false;
    } else if (c === '"') quoted = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim()));
}

// Maps each field to its column number, matching headings loosely ("Post code" = "Postcode").
function csvColumns(headRow, spec) {
  const key = h => h.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const head = (headRow || []).map(key), col = {};
  for (const [field, names] of Object.entries(spec)) { const i = head.findIndex(h => names.includes(h)); if (i >= 0) col[field] = i; }
  return col;
}

const PLAYER_COLUMNS = {
  team: ["teams", "team", "team name"],
  first: ["first name", "firstname", "first", "forename"],
  last: ["last name", "lastname", "last", "surname"],
  nick: ["nickname", "nick name", "nick"],
};
// Works out which players to add to which team, and which rows are flagged or skipped.
function playerImportPlan(text) {
  const rows = parseCsv(text);
  const plan = { add: [], already: 0, flagged: [], problems: [] };
  const col = csvColumns(rows[0], PLAYER_COLUMNS);
  if (!("team" in col) || !("first" in col)) return { ...plan, error: "This file needs Teams and First Name columns. Download the template and use its headings." };
  const teamByName = Object.fromEntries(Object.values(S.teams).map(t => [t.name.toLowerCase(), t]));
  const onTeam = {}, teamsWith = {};
  for (const t of Object.values(S.teams)) {
    onTeam[t.id] = new Set(playersOf(t).map(p => fullName(p).toLowerCase()));
    for (const p of playersOf(t)) { const k = nameKey(p); if (k) (teamsWith[k] ||= new Set()).add(t.name); }
  }
  rows.slice(1).forEach((r, i) => {
    if (!r.some(Boolean)) return;
    const line = i + 2, get = f => (f in col ? r[col[f]] || "" : "").replace(/\s+/g, " ").trim();
    const teamName = get("team"), player = { first: get("first"), last: get("last"), nick: get("nick") };
    const who = fullName(player) || "a player";
    if (!teamName) return plan.problems.push(`Row ${line} (${who}): no team given.`);
    const t = teamByName[teamName.toLowerCase()];
    if (!t) return plan.problems.push(`Row ${line} (${who}): there's no team called "${teamName}". Add the team first, then import again.`);
    if (!player.first) return plan.problems.push(`Row ${line} (${t.name}): no first name.`);
    const dk = fullName(player).toLowerCase();
    if (onTeam[t.id].has(dk)) return plan.already++;
    onTeam[t.id].add(dk);
    plan.add.push({ teamId: t.id, teamName: t.name, line, player });
  });
  // Flag names that are also on a different team, already saved or elsewhere in this file.
  const fileTeams = {};
  for (const a of plan.add) { const k = nameKey(a.player); if (k) (fileTeams[k] ||= new Set()).add(a.teamName); }
  for (const a of plan.add) {
    const k = nameKey(a.player); if (!k) continue;
    const others = [...new Set([...(teamsWith[k] || []), ...(fileTeams[k] || [])])].filter(n => n !== a.teamName);
    if (others.length) plan.flagged.push(`Row ${a.line}: ${fullName(a.player)} (${a.teamName}) is also on ${others.join(", ")}.`);
  }
  return plan;
}

const VENUE_COLUMNS = {
  name: ["venue name", "venue", "name"],
  address1: ["address line 1", "address 1", "address1", "address"],
  address2: ["address line 2", "address 2", "address2"],
  address3: ["address line 3", "address 3", "address3", "town"],
  postcode: ["postcode", "post code"],
  phone: ["telephone", "telephone number", "phone", "phone number", "tel"],
  alleys: ["number of alleys", "alleys", "no of alleys", "number of alley"],
};
// Works out which CSV rows add a venue, update one, or have a problem.
function venueImportPlan(text) {
  const rows = parseCsv(text);
  const plan = { add: [], update: [], same: [], problems: [] };
  const col = csvColumns(rows[0], VENUE_COLUMNS);
  if (!("name" in col)) return { ...plan, error: "This file needs a Venue Name column. Download the template and use its headings." };
  const byName = Object.fromEntries(Object.values(S.venues).map(v => [v.name.toLowerCase(), v]));
  const seen = new Set();
  rows.slice(1).forEach((r, i) => {
    if (!r.some(Boolean)) return;
    const line = i + 2, get = f => (f in col ? r[col[f]] || "" : "").replace(/\s+/g, " ").trim();
    const name = get("name");
    if (!name) return plan.problems.push(`Row ${line}: no venue name.`);
    if (seen.has(name.toLowerCase())) return plan.problems.push(`Row ${line} (${name}): this venue is listed more than once.`);
    seen.add(name.toLowerCase());
    const rec = { name, address1: get("address1"), address2: get("address2"), address3: get("address3"), postcode: "", phone: get("phone"), alleys: null };
    const pc = get("postcode");
    if (pc) { rec.postcode = normPostcode(pc); if (!rec.postcode) return plan.problems.push(`Row ${line} (${name}): "${pc}" isn't a UK postcode.`); }
    const al = get("alleys");
    if (al) { rec.alleys = /^\d+$/.test(al) ? +al : NaN; if (!(rec.alleys >= 1 && rec.alleys <= 20)) return plan.problems.push(`Row ${line} (${name}): number of alleys should be a whole number from 1 to 20, not "${al}".`); }
    const v = byName[name.toLowerCase()];
    if (!v) return plan.add.push(rec);
    const cur = { ...venueAddr(v), phone: v.phone || "", alleys: v.alleys || 1 }, changes = {};
    for (const f of ["address1", "address2", "address3", "postcode", "phone", "alleys"]) if (rec[f] && rec[f] !== cur[f]) changes[f] = rec[f];
    Object.keys(changes).length ? plan.update.push({ id: v.id, name: v.name, changes }) : plan.same.push(v.name);
  });
  return plan;
}

const osmLink = (lat, lng) => `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=17/${lat}/${lng}`;
const maps = new Map();
function dropMaps(root) {
  for (const [el, m] of maps) if (!el.isConnected || root?.contains(el)) { m.remove(); maps.delete(el); }
}
function drawMap(el, lat, lng, label) {
  dropMaps();
  maps.get(el)?.remove();
  el.classList.remove("map-off");
  if (!window.L || !Number.isFinite(lat) || !Number.isFinite(lng)) {
    el.innerHTML = `<div class="map-note">Map unavailable. <a href="${osmLink(lat, lng)}" target="_blank" rel="noopener">Open in OpenStreetMap</a></div>`;
    return;
  }
  const m = L.map(el, { scrollWheelZoom: false }).setView([lat, lng], 15);
  const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(m);
  tiles.once("tileerror", () => {
    el.classList.add("map-off");
    el.insertAdjacentHTML("beforeend", `<div class="map-note">The map can't load here. <a href="${osmLink(lat, lng)}" target="_blank" rel="noopener">Open in OpenStreetMap</a></div>`);
  });
  L.marker([lat, lng], { icon: L.divIcon({ className: "pin", iconSize: [18, 18] }), title: label || "" }).addTo(m);
  maps.set(el, m);
}

// One team per line; takes the first column of a CSV row and ignores a "Team Name" heading.
function parseTeamNames(text) {
  const out = [], seen = new Set();
  for (const line of String(text).replace(/^\uFEFF/, "").split(/\r?\n/)) {
    let cell = line.trim();
    if (cell.startsWith('"')) { const m = /^"((?:[^"]|"")*)"/.exec(cell); cell = m ? m[1].replace(/""/g, '"') : cell.slice(1); }
    else cell = cell.split(/[,\t]/)[0];
    cell = cell.trim().replace(/\s+/g, " ");
    if (!cell || /^team\s*names?$/i.test(cell) || seen.has(cell.toLowerCase())) continue;
    seen.add(cell.toLowerCase()); out.push(cell);
  }
  return out;
}

    <button type="button" class="btn ghost sm" data-act="rm-player">Remove</button></div>

}

function roundRobin(ids, double) {
  const t = [...ids]; if (t.length % 2) t.push(null);
  const n = t.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) {
      const a = t[i], b = t[n - 1 - i];
      if (a && b) pairs.push((r + i) % 2 ? [b, a] : [a, b]);
    }
    rounds.push(pairs);
    t.splice(1, 0, t.pop());
  }
  return double ? rounds.concat(rounds.map(p => p.map(([a, b]) => [b, a]))) : rounds;
}
function addDays(d, n) { const dt = new Date(d + "T12:00:00"); dt.setDate(dt.getDate() + n); return dt.toISOString().slice(0, 10); }
function nextWeekday(wd) { const dt = new Date(); dt.setHours(12); dt.setDate(dt.getDate() + ((wd - dt.getDay() + 7) % 7 || 7)); return dt.toISOString().slice(0, 10); }

      if (!r) return;
      delete f.dataset.dirty; toast("League details saved");
      if (r.league.slug !== oldSlug) NAV.go(leaguePath(r.league.slug), "league-setup"); else refresh();
    });
  },
  refresh() {
    const f = $("#set-form"); if (f.dataset.dirty) return;
    const c = cfg();
    $("#s-name").value = S.league.name; $("#s-slug").value = S.league.slug; $("#s-slug-note").textContent = `Later this will also be ${S.league.slug}.skittlers.co.uk`;
    $("#s-win").value = c.win; $("#s-draw").value = c.draw; $("#s-loss").value = c.loss;
  }
};

/* ---------- example season & clearing ---------- */
async function loadExample() {
  if (S.busy) return;
  S.busy = true; toast("Loading example season…");
  const ok = await commit(d => {
    const vid = {}, div = newId() + "div";
    d.divisions[div] = { id: div, name: "Division 1", order: 1 };
    const V = [
      ["plough", "The Plough", 1, 2, "Taunton", "TA1 1AA", 51.0152, -3.1009],
      ["lion", "Red Lion", 2, 1, "Bridgwater", "TA6 3AA", 51.1283, -3.0035],
      ["crown", "Crown & Anchor", 3, 3, "Wellington", "TA21 8AA", 50.9786, -3.2265],
    ];
    for (const [key, name, n, alleys, town, postcode, lat, lng] of V) {
      const id = newId() + key;
      d.venues[id] = { id, name: `${name} (example)`, address1: `${n} Example Street`, address2: town, address3: "Somerset", postcode, lat, lng, phone: `01632 96000${n}`, alleys };
      vid[key] = id;
    }
    const T = [
      ["Plough Pinheads", "plough", 1], ["Ploughshares", "plough", 2], ["Lion Hearts", "lion", 1],
      ["Anchor Men", "crown", 1], ["Crown Jewels", "crown", 2], ["Sunday Spares", "crown", 3],
    ];
    const tid = T.map(([name, v, alley], i) => {
      const id = newId() + i;
      const surname = ["Ashby", "Brook", "Carter", "Dunn", "Ellis", "Fry"][i];
      d.teams[id] = { id, name: `${name} (example)`, division: div, venue: vid[v], alley, captainFirst: "Example", captainLast: surname,
        players: ["Dave", "Sue", "Tom", "Jan", "Pete", "Liz", "Mark", "Kate"].map(first => ({ first, last: surname, nick: { Dave: "Tank", Liz: "Lucky" }[first] || "" })) };
      d.contacts[id] = { address: `${i + 10} Example Close\nSomerset`, mobile: `07700 9000${i + 10}` };
      return id;
    });
    let seed = 7, k = 0;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const now = today();
    roundRobin(tid, true).forEach((pairs, r) => {
      const date = addDays("2026-09-10", r * 7);
      for (const [home, away] of pairs) {
        const id = newId() + "x" + k++, p = date < now;
        d.fixtures[id] = { id, comp: "league", round: null, date, time: "19:45", home, away, venue: null, alley: null,
          homePins: p ? 250 + Math.round(rnd() * 80) : null, awayPins: p ? 240 + Math.round(rnd() * 80) : null };
      }
    });
    for (const [date, h, a, hp, ap] of [["2026-10-22", 0, 3, 301, 288], ["2026-10-22", 2, 5, 276, 276], ["2026-11-26", 1, 4, null, null]]) {
      const id = newId() + "c" + k++;
      d.fixtures[id] = { id, comp: "cup", round: "Round 1", date, time: "19:45", home: tid[h], away: tid[a], venue: null, alley: null, homePins: hp, awayPins: ap };
    }
  });
  S.busy = false;
  if (ok) toast("Example season loaded");
}
async function clearAll() {
  if (S.busy) return;
  S.busy = true;
  const ok = await commit(d => { d.teams = {}; d.venues = {}; d.fixtures = {}; d.contacts = {}; d.divisions = {}; });
  S.busy = false;
  if (ok) toast("This season's teams, venues, divisions and fixtures were deleted");
}

/* ---------- actions ---------- */
document.addEventListener("click", async e => {
  const link = e.target.closest("a[data-path]");
  if (link && !e.ctrlKey && !e.metaKey && !e.shiftKey) { e.preventDefault(); return NAV.go(link.dataset.path, link.dataset.hash); }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act === "logout") { signedOut("Logged out"); }
  if (act === "secretary-login") {
    e.preventDefault();
    try { sessionStorage.setItem(AFTER_LOGIN, JSON.stringify({ path: leaguePath(S.league.slug), hash: "seasons" })); } catch {}
    NAV.go("/", "login");
  }
  if (act === "use-season") { useSeason(id); toast(`Now working on season ${S.league.seasons.find(s => s.id === id)?.name}`); }
  if (act === "publish-season") { if (await leagueRequest("", "PATCH", { currentSeasonId: id })) { refresh(); toast("The public site now shows this season"); } }
  if (act === "edit-season") VIEWS.seasons.edit(id);
  if (act === "cancel-season") VIEWS.seasons.reset();
  if (act === "del-season") {
    if (!arm(b, "Click again: deletes its teams, fixtures and results")) return;
    const r = await leagueRequest(`/seasons/${id}`, "DELETE");
    if (r) { toast("Season deleted"); if (S.seasonId === id) useSeason(S.league.currentSeasonId); else refresh(); VIEWS.seasons.reset?.(); }
  }
  if (act === "dv-save") VIEWS.divisions.save();
  if (act === "dv-undo") VIEWS.divisions.undo();
  if (act === "dv-add") VIEWS.divisions.add();
  if (act === "dv-bulk") VIEWS.divisions.bulk();
  if (act === "dv-del") { if (!arm(b, "Confirm")) return; VIEWS.divisions.remove(id); }
  if (act === "del-league") {
    if (!arm(b, "Click again to delete the league for good")) return;
    if (await leagueRequest("", "DELETE")) { toast("League deleted"); NAV.go("/", "leagues"); }
  }
  if (act === "su-save" || act === "su-year") {
    const until = act === "su-year" ? addDays(today(), 365) : $(`#su-until-${CSS.escape(id)}`).value;
    if (!until) return toast("Choose the date the subscription runs until.");
    VIEWS.super.saveSub(id, { status: act === "su-year" ? "paid" : $(`#su-st-${CSS.escape(id)}`).value, until });
  }
  if (act === "su-reset") {
    if (!arm(b, "Click again to reset")) return;
    try {
      const r = await send(`/api/super/users/${id}`, "PATCH", { resetPassword: true }), out = $(`#su-temp-${CSS.escape(id)}`);
      out.hidden = false; out.innerHTML = `Temporary password: <code>${esc(r.temporaryPassword)}</code>. Give it to ${esc(r.user.name)}; they can change it on their Account page.`;
    } catch (x) { saveError(x); }
  }
  if (act === "legacy-copy") {
    if (!arm(b, "Click again: replaces that season's data")) return;
    try { const r = await send("/api/super/legacy", "POST", { leagueId: $("#lgc-league").value, seasonId: $("#lgc-season").value }); toast(`Copied ${plural(r.copied.teams, "team")}, ${plural(r.copied.venues, "venue")} and ${plural(r.copied.fixtures, "fixture")}`); }
    catch (x) { saveError(x); }
  }
  if (act === "add-player") { $("#t-players").insertAdjacentHTML("beforeend", playerRow()); $("#t-players .player:last-child .p-first").focus(); }
  if (act === "rm-player") {
    const rows = $$("#t-players .player");
    if (rows.length > 1) b.closest(".player").remove();
    else $$("input", rows[0]).forEach(i => i.value = "");
    VIEWS.teams.checkDuplicates();
  }
  if (act === "edit-team") VIEWS.teams.edit(id);
  if (act === "cancel-team") VIEWS.teams.reset();
  if (act === "del-team") {
    const n = Object.values(S.fixtures).filter(f => f.home === id || f.away === id).length;
    if (n) return toast(`${teamName(id)} has ${n} fixture${n > 1 ? "s" : ""}. Delete those first.`);
    if (!arm(b)) return;
    if (await commit(d => { delete d.teams[id]; delete d.contacts[id]; })) {
      toast("Team deleted");
      if ($("#team-form")?.dataset.id === id) VIEWS.teams.reset();
    }
  }
  if (act === "edit-venue") VIEWS.venues.edit(id);
  if (act === "cancel-venue") VIEWS.venues.reset();
  if (act === "del-venue") {
    const n = Object.values(S.teams).filter(t => t.venue === id).length;
    if (n) return toast(`${n} team${n > 1 ? "s use" : " uses"} this venue. Move ${n > 1 ? "them" : "it"} to another venue first.`);
    if (!arm(b)) return;
    if (await commit(d => { delete d.venues[id]; })) {
      toast("Venue deleted");
      if ($("#venue-form")?.dataset.id === id) VIEWS.venues.reset();
    }
  }
  if (act === "save-result") VIEWS["manage-fixtures"].saveResult(id, b.closest(".fx-admin"));
  if (act === "edit-fx") VIEWS["manage-fixtures"].edit(id);
  if (act === "cancel-fx") VIEWS["manage-fixtures"].reset();
  if (act === "del-fx") {
    if (!arm(b, "Confirm")) return;
    if (await commit(d => { delete d.fixtures[id]; })) toast("Fixture deleted");
  }
  if (act === "load-example") loadExample();
  if (act === "clear-all") { if (!arm(b, "Click again to delete everything")) return; clearAll(); }
});
document.addEventListener("change", e => { if (e.target.id === "season-pick") useSeason(e.target.value); });
window.addEventListener("hashchange", route);
// Pick up other people's changes when someone comes back to the tab.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - S.loadedAt > 60000) load();
});

/* ---------- boot ---------- */
async function boot() {
  Object.assign(S, { user: null, myLeagues: [], league: null, seasonId: null, admin: false, status: "connecting", version: 0,
    teams: {}, venues: {}, fixtures: {}, divisions: {}, contacts: {}, loaded: { teams: false, venues: false, fixtures: false } });
  S.token = store.get(TOKEN_KEY);
  S.slug = slugFromLocation();
  S.mode = S.slug ? "league" : "account";
  if (S.mode === "account" && !S.token) return route();
  route();
  await loadMe();
  if (S.mode === "account") return route();
  await openLeague();
}
window.SKITTLERS_BOOT = boot;
boot();
</script>
