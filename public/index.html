<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skittles League</title>
<meta name="description" content="League tables, league fixtures and cup fixtures.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='8' fill='%231D4533'/%3E%3Cg fill='%23F3F1E6'%3E%3Ccircle cx='22' cy='8' r='3.4'/%3E%3Ccircle cx='15' cy='15' r='3.4'/%3E%3Ccircle cx='29' cy='15' r='3.4'/%3E%3Ccircle cx='8' cy='22' r='3.4'/%3E%3Ccircle cx='36' cy='22' r='3.4'/%3E%3Ccircle cx='15' cy='29' r='3.4'/%3E%3Ccircle cx='29' cy='29' r='3.4'/%3E%3Ccircle cx='22' cy='36' r='3.4'/%3E%3C/g%3E%3Ccircle cx='22' cy='22' r='4.2' fill='%23B7842A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: a bottle-green pub-sign band holds the league name and tabs; below it, a paper page with tables and fixture cards. Admin views split into list + form. */
:root {
  --paper: #F2F5F1;
  --surface: #FFFFFF;
  --sunk: #E8EEE9;
  --ink: #17241E;
  --muted: #5A6B62;
  --line: #D3DCD5;
  --baize: #1D4533;
  --baize-2: #275A43;
  --on-baize: #F3F1E6;
  --on-baize-muted: #B9C9BE;
  --brass: #B7842A;
  --brass-ink: #855A0F;
  --win: #2C7448;
  --loss: #A43E36;
  --draw: #82661A;
  --warn-bg: #FBF0D9;
  --font-display: "Rokkitt", "Rockwell", "Georgia", serif;
  --font-body: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1512; --surface: #15201B; --sunk: #1B2822; --ink: #E5ECE7; --muted: #94A59B; --line: #2A3A31;
    --baize: #12301F; --baize-2: #1B412C; --on-baize: #F1EEDF; --on-baize-muted: #9DB4A5;
    --brass: #D6A447; --brass-ink: #E3B862; --win: #5DBB80; --loss: #E07A70; --draw: #D4B45A; --warn-bg: #3A2F14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1512; --surface: #15201B; --sunk: #1B2822; --ink: #E5ECE7; --muted: #94A59B; --line: #2A3A31;
  --baize: #12301F; --baize-2: #1B412C; --on-baize: #F1EEDF; --on-baize-muted: #9DB4A5;
  --brass: #D6A447; --brass-ink: #E3B862; --win: #5DBB80; --loss: #E07A70; --draw: #D4B45A; --warn-bg: #3A2F14;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--baize); }
.wrap { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* Header band */
.band { background: var(--baize); color: var(--on-baize); }
.band .wrap { padding-block: 22px 0; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand svg { flex: none; }
.brand h1 { font-size: clamp(1.7rem, 4vw, 2.5rem); font-weight: 800; letter-spacing: .01em; }
.brand .season { color: var(--on-baize-muted); font-size: .95rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.tabs { display: flex; gap: 4px; margin-top: 18px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; color: var(--on-baize-muted); text-decoration: none; font-weight: 600; padding: 10px 14px; border-radius: var(--r) var(--r) 0 0; white-space: nowrap; }
.tabs a:hover { color: var(--on-baize); background: var(--baize-2); }
.tabs a[aria-current="page"] { background: var(--paper); color: var(--ink); }
.tabs .sep { flex: none; align-self: center; margin: 0 8px; color: var(--on-baize-muted); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
.tabs .end { margin-left: auto; }
.tabs button.end { flex: none; background: none; border: 0; color: var(--on-baize-muted); font-weight: 600; padding: 10px 14px; cursor: pointer; }
.tabs button.end:hover { color: var(--on-baize); }
.login { max-width: 420px; }

main { padding-block: 28px 64px; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
.view-head h2 { font-size: 1.9rem; font-weight: 800; }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.eyebrow { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--brass-ink); }

/* League table */
.division { margin-bottom: 32px; }
.division h3 { font-size: 1.35rem; margin-bottom: 10px; }
.table-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table.league { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 760px; }
.league th, .league td { padding: 10px 12px; text-align: right; white-space: nowrap; }
.league th { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; border-bottom: 2px solid var(--line); vertical-align: bottom; }
.league th abbr { text-decoration: none; cursor: help; }
.league td { border-bottom: 1px solid var(--line); }
.league tr:last-child td { border-bottom: 0; }
.league .pos { text-align: center; width: 48px; font-weight: 700; color: var(--muted); }
.league tr:first-child .pos { color: var(--brass-ink); }
.league .team { text-align: left; font-weight: 600; white-space: normal; min-width: 180px; }
.league .pts { font-weight: 800; font-size: 1.05rem; background: var(--sunk); }
.league th.pts { background: var(--sunk); color: var(--ink); }
.neg { color: var(--loss); }
.pos-val { color: var(--win); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; color: var(--muted); font-size: .85rem; }
.legend b { color: var(--ink); font-weight: 600; }

/* Fixtures */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--baize); color: var(--on-baize); }
.date-group { margin-bottom: 22px; }
.date-group h3 { font-family: var(--font-body); font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.fx-list { display: grid; gap: 8px; }
.fx { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 4px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
.fx .home { text-align: right; font-weight: 600; min-width: 0; }
.fx .away { font-weight: 600; min-width: 0; }
.fx .score { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; text-align: center; min-width: 120px; }
.fx .score .v { color: var(--muted); font-weight: 500; font-size: .95rem; }
.fx .won { color: var(--win); }
.fx .meta { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: .85rem; }
.chip { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.chip.cup { background: var(--brass); color: var(--surface); }
.chip.warn { background: var(--warn-bg); color: var(--brass-ink); }
.round { margin-bottom: 26px; }
.round > h3 { font-size: 1.3rem; margin-bottom: 10px; }

/* Panels, forms, admin */
.split { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.split > * { min-width: 0; }
@media (max-width: 880px) { .split { grid-template-columns: minmax(0, 1fr); } .split .form-col { order: -1; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.panel + .panel { margin-top: 16px; }
.panel h3 { font-size: 1.25rem; margin-bottom: 14px; }
.form { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-size: .8rem; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.field .hint { font-size: .8rem; color: var(--muted); }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
input[type=text], input[type=tel], input[type=number], input[type=date], input[type=time], select, textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { border-color: var(--brass); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--brass) 30%, transparent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 6px; padding: 9px 16px; font-weight: 600; cursor: pointer; background: var(--baize); color: var(--on-baize); }
.btn:hover { background: var(--baize-2); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--sunk); }
.btn.danger { background: transparent; color: var(--loss); border-color: var(--line); }
.btn.danger[data-armed] { background: var(--loss); color: var(--surface); border-color: var(--loss); }
.btn.sm { padding: 5px 10px; font-size: .85rem; }
.btn:disabled { opacity: .55; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.players { display: grid; gap: 6px; }
.player-row { display: flex; gap: 6px; }
.player-row input { flex: 1; }
.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.card.editing { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
.card-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; flex-wrap: wrap; }
.card-head h3 { font-size: 1.25rem; }
.card-head .sub { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: .92rem; margin: 0; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: var(--sunk); border-radius: 999px; padding: 2px 10px; font-size: .85rem; }
.alley-grid { display: grid; gap: 6px; }
.alley-row { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px; font-size: .92rem; }
.alley-row .n { font-weight: 700; color: var(--brass-ink); }
.assign-row { display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: 10px; align-items: center; }

.fx-admin { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.fx-admin.editing { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
.fx-admin .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .85rem; color: var(--muted); grid-column: 1 / -1; }
.result-line { display: grid; grid-template-columns: minmax(0,1fr) 78px 12px 78px minmax(0,1fr); gap: 8px; align-items: center; }
.result-line .h { text-align: right; font-weight: 600; overflow-wrap: anywhere; }
.result-line .a { font-weight: 600; overflow-wrap: anywhere; }
.result-line input { text-align: center; padding: 7px 4px; font-variant-numeric: tabular-nums; }
.result-line .dash { text-align: center; color: var(--muted); }
@media (max-width: 560px) {
  .fx-admin { grid-template-columns: minmax(0, 1fr); }
  .result-line { grid-template-columns: minmax(0,1fr) 64px; }
  .result-line .h { text-align: left; }
  .result-line .dash { display: none; }
  .fx { grid-template-columns: minmax(0,1fr); text-align: center; }
  .fx .home, .fx .away { text-align: center; }
}

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 6px; }
.empty .actions { justify-content: center; margin-top: 14px; }
.notice { background: var(--warn-bg); color: var(--ink); border-radius: var(--r); padding: 12px 16px; margin-bottom: 18px; font-size: .92rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: var(--r); font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
.muted { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .btn, .tabs a, .seg button { transition: background .15s, color .15s; } }
</style>
</head>
<body>

<header class="band">
  <div class="wrap">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <g fill="var(--on-baize)">
          <circle cx="22" cy="6" r="3.4"/>
          <circle cx="15" cy="13" r="3.4"/><circle cx="29" cy="13" r="3.4"/>
          <circle cx="8" cy="20" r="3.4"/><circle cx="36" cy="20" r="3.4"/>
          <circle cx="15" cy="27" r="3.4"/><circle cx="29" cy="27" r="3.4"/>
          <circle cx="22" cy="34" r="3.4"/>
        </g>
        <circle cx="22" cy="20" r="4.2" fill="var(--brass)"/>
      </svg>
      <div>
        <h1 id="league-name">Skittles League</h1>
        <div class="season" id="league-season">Season 2026–27</div>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>

<main class="wrap" id="main" aria-live="polite"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => (v === "" || v == null || !Number.isFinite(+v)) ? null : Math.round(+v);

const DEFAULTS = { name: "Skittles League", season: "2026–27", win: 2, draw: 1, loss: 0 };
const S = {
  token: null, admin: false, status: "connecting", version: 0, loadedAt: 0,
  teams: {}, venues: {}, fixtures: {}, contacts: {}, settings: {},
  loaded: { teams: false, venues: false, fixtures: false },
  ui: { fxTeam: "", fxShow: "upcoming", adminComp: "all", adminShow: "open" },
  busy: false,
};
const cfg = () => ({ ...DEFAULTS, ...S.settings });
const ready = () => S.loaded.teams && S.loaded.venues && S.loaded.fixtures;

/* ---------- helpers ---------- */
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200);
}
function arm(btn, label = "Click again to confirm") {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = "1"; btn.dataset.orig = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 3500);
  return false;
}
const teamName = id => S.teams[id]?.name || "Unknown team";
const sortedTeams = () => Object.values(S.teams).sort((a, b) => a.name.localeCompare(b.name));
const sortedVenues = () => Object.values(S.venues).sort((a, b) => a.name.localeCompare(b.name));
const divisions = () => [...new Set(Object.values(S.teams).map(t => t.division || "Division 1"))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
const played = f => Number.isFinite(f.homePins) && Number.isFinite(f.awayPins);
const fxSort = (a, b) => (a.date || "").localeCompare(b.date || "") || (a.time || "").localeCompare(b.time || "") || teamName(a.home).localeCompare(teamName(b.home));
function fxVenue(f) {
  const vid = f.venue || S.teams[f.home]?.venue;
  const v = S.venues[vid];
  const alley = f.alley || (vid && vid === S.teams[f.home]?.venue ? S.teams[f.home]?.alley : null);
  return { v, alley: v && v.alleys > 1 ? alley : null, vid };
}
function fmtDate(d, long) {
  if (!d) return "Date to be set";
  const dt = new Date(d + "T12:00:00");
  return dt.toLocaleDateString("en-GB", long ? { weekday: "long", day: "numeric", month: "long", year: "numeric" } : { weekday: "short", day: "numeric", month: "short" });
}
const today = () => new Date().toISOString().slice(0, 10);
const signed = n => n > 0 ? `+${n}` : String(n);
const cls = n => n > 0 ? "pos-val" : n < 0 ? "neg" : "";
const newId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------- data: Netlify Function API ---------- */
const TOKEN_KEY = "skittles-admin-token";
const storage = {
  get() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } },
  set(v) { try { v ? localStorage.setItem(TOKEN_KEY, v) : localStorage.removeItem(TOKEN_KEY); } catch {} },
};
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "content-type": "application/json", ...(S.token ? { authorization: `Bearer ${S.token}` } : {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || "Something went wrong"), { status: res.status, body });
  return body;
}
function apply(d) {
  S.version = d.version || 0;
  S.teams = d.teams || {}; S.venues = d.venues || {}; S.fixtures = d.fixtures || {}; S.settings = d.settings || {};
  if (d.contacts) S.contacts = d.contacts;
  S.loaded = { teams: true, venues: true, fixtures: true };
  S.status = "live"; S.loadedAt = Date.now();
  refresh();
}
async function load() {
  try { apply(await api(S.admin ? "/api/admin" : "/api/league")); }
  catch (e) {
    if (e.status === 401 && S.admin) { logout(); toast("Your admin session has ended. Log in again."); return; }
    S.status = "offline"; refresh();
  }
}
// Every admin change sends the whole league back with the version it was based on.
// If someone else saved in between, the server refuses (409) and we reload their version.
async function commit(mutate) {
  const draft = structuredClone({ teams: S.teams, venues: S.venues, fixtures: S.fixtures, settings: S.settings, contacts: S.contacts });
  mutate(draft);
  const { contacts, ...league } = draft;
  try {
    apply(await api("/api/admin", { method: "PUT", body: JSON.stringify({ version: S.version, league, contacts }) }));
    return true;
  } catch (e) {
    if (e.status === 409) { apply(e.body); toast("Another admin saved changes just now. The page has been updated, so make your change again."); }
    else if (e.status === 401) { logout(); toast("Your admin session has ended. Log in again."); }
    else toast(e.status ? e.message : "Couldn't save. Check your connection and try again.");
    return false;
  }
}
async function login(password) {
  const { token } = await api("/api/login", { method: "POST", body: JSON.stringify({ password }) });
  S.token = token; S.admin = true; storage.set(token);
  await load();
}
function logout() {
  S.token = null; S.admin = false; S.contacts = {}; storage.set(null);
  if (ADMIN_VIEWS.some(([id]) => id === location.hash.slice(1))) location.hash = "tables";
  route(); load();
}

function clashes() {
  const seen = {}, out = new Set();
  for (const f of Object.values(S.fixtures)) {
    if (!f.date) continue;
    const { vid, alley } = fxVenue(f);
    if (!vid) continue;
    const k = `${f.date}|${vid}|${alley || 1}`;
    (seen[k] ||= []).push(f.id);
  }
  Object.values(seen).forEach(ids => ids.length > 1 && ids.forEach(id => out.add(id)));
  return out;
}

/* ---------- standings ---------- */
function standings() {
  const c = cfg(), rows = {};
  for (const t of Object.values(S.teams)) rows[t.id] = { t, P: 0, W: 0, D: 0, L: 0, hp: 0, ap: 0, pf: 0, pa: 0, apd: 0 };
  for (const f of Object.values(S.fixtures)) {
    if (f.comp !== "league" || !played(f)) continue;
    const h = rows[f.home], a = rows[f.away];
    if (!h || !a) continue;
    const hp = f.homePins, ap = f.awayPins;
    h.P++; a.P++;
    h.hp += hp; a.ap += ap;
    h.pf += hp; h.pa += ap; a.pf += ap; a.pa += hp;
    a.apd += ap - hp;
    if (hp > ap) { h.W++; a.L++; } else if (hp < ap) { a.W++; h.L++; } else { h.D++; a.D++; }
  }
  const byDiv = {};
  for (const r of Object.values(rows)) {
    r.pd = r.pf - r.pa;
    r.pts = r.W * c.win + r.D * c.draw + r.L * c.loss;
    (byDiv[r.t.division || "Division 1"] ||= []).push(r);
  }
  for (const list of Object.values(byDiv))
    list.sort((a, b) => b.pts - a.pts || b.pd - a.pd || b.apd - a.apd || a.t.name.localeCompare(b.t.name));
  return byDiv;
}

const PUBLIC_VIEWS = [["tables", "League tables"], ["fixtures", "League fixtures"], ["cup", "Cup fixtures"]];
const ADMIN_VIEWS = [["teams", "Teams"], ["venues", "Venues"], ["manage-fixtures", "Fixtures & results"], ["league-setup", "League setup"]];
let current = null;

function renderNav() {
  const v = currentView();
  const link = ([id, label]) => `<a href="#${id}"${id === v ? ' aria-current="page"' : ""}>${label}</a>`;
  $("#tabs").innerHTML = PUBLIC_VIEWS.map(link).join("") +
    (S.admin
      ? `<span class="sep">Admin</span>` + ADMIN_VIEWS.map(link).join("") + `<button type="button" class="end" data-act="logout">Log out</button>`
      : `<a class="end" href="#admin"${v === "admin" ? ' aria-current="page"' : ""}>Admin login</a>`);
}
function renderBrand() {
  const c = cfg();
  document.title = c.name;
  $("#league-name").textContent = c.name;
  $("#league-season").textContent = c.season ? `Season ${c.season}` : "";
}
function currentView() {
  const h = location.hash.slice(1);
  if (PUBLIC_VIEWS.some(([id]) => id === h)) return h;
  if (S.admin && ADMIN_VIEWS.some(([id]) => id === h)) return h;
  if (h === "admin" || ADMIN_VIEWS.some(([id]) => id === h)) return S.admin ? "teams" : "admin";
  return "tables";
}
function route() {
  const v = currentView();
  renderNav();
  current = VIEWS[v];
  $("#main").innerHTML = "";
  current.mount($("#main"));
  refresh();
}
function refresh() {
  renderBrand();
  current?.refresh();
}
function statusBlock() {
  if (S.status === "connecting") return `<div class="empty"><strong>Loading league data…</strong></div>`;
  if (S.status !== "live") return `<div class="empty"><strong>Couldn't load the league data</strong>Check your connection and refresh the page.</div>`;
  if (!ready()) return `<div class="empty"><strong>Loading league data…</strong></div>`;

}

function fxCard(f, showComp) {
  const { v, alley } = fxVenue(f);
  const p = played(f);
  const hw = p && f.homePins > f.awayPins, aw = p && f.awayPins > f.homePins;
  const where = v ? `${esc(v.name)}${alley ? ` · Alley ${alley}` : ""}` : "Venue to be confirmed";
  return `<div class="fx">
    <div class="home ${hw ? "won" : ""}">${esc(teamName(f.home))}</div>
    <div class="score">${p ? `<span class="${hw ? "won" : ""}">${f.homePins}</span> <span class="v">–</span> <span class="${aw ? "won" : ""}">${f.awayPins}</span>` : `<span class="v">${esc(f.time || "v")}</span>`}</div>
    <div class="away ${aw ? "won" : ""}">${esc(teamName(f.away))}</div>
    <div class="meta">${showComp && f.comp === "cup" ? `<span class="chip cup">${esc(f.round || "Cup")}</span> ` : ""}${where}</div>
  </div>`;
}
function groupByDate(list, desc) {
  const g = {};
  list.forEach(f => (g[f.date || ""] ||= []).push(f));
  const keys = Object.keys(g).sort();
  if (desc) keys.reverse();
  return keys.map(d => `<div class="date-group"><h3>${fmtDate(d, true)}</h3><div class="fx-list">${g[d].map(f => fxCard(f)).join("")}</div></div>`).join("");
}

function roundRobin(ids, double) {
  const t = [...ids]; if (t.length % 2) t.push(null);
  const n = t.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) {
      const a = t[i], b = t[n - 1 - i];
      if (a && b) pairs.push((r + i) % 2 ? [b, a] : [a, b]);
    }
    rounds.push(pairs);
    t.splice(1, 0, t.pop());
  }
  return double ? rounds.concat(rounds.map(p => p.map(([a, b]) => [b, a]))) : rounds;
}
function addDays(d, n) { const dt = new Date(d + "T12:00:00"); dt.setDate(dt.getDate() + n); return dt.toISOString().slice(0, 10); }
function nextWeekday(wd) { const dt = new Date(); dt.setHours(12); dt.setDate(dt.getDate() + ((wd - dt.getDay() + 7) % 7 || 7)); return dt.toISOString().slice(0, 10); }

async function loadExample() {
  if (S.busy) return;
  S.busy = true; toast("Loading example season…");
  const ok = await commit(d => {
    const vid = {};
    for (const [key, name, n, alleys] of [["plough", "The Plough", 1, 2], ["lion", "Red Lion", 2, 1], ["crown", "Crown & Anchor", 3, 3]]) {
      const id = newId() + key;
      d.venues[id] = { id, name: `${name} (example)`, address: `${n} Example Street\nSomerset`, phone: `01632 96000${n}`, alleys };
      vid[key] = id;
    }
    const T = [
      ["Plough Pinheads", "plough", 1], ["Ploughshares", "plough", 2], ["Lion Hearts", "lion", 1],
      ["Anchor Men", "crown", 1], ["Crown Jewels", "crown", 2], ["Sunday Spares", "crown", 3],
    ];
    const tid = T.map(([name, v, alley], i) => {
      const id = newId() + i;
      d.teams[id] = { id, name: `${name} (example)`, division: "Division 1", venue: vid[v], alley, captain: "Example captain",
        players: Array.from({ length: 8 }, (_, k) => `Example player ${k + 1}`) };
      d.contacts[id] = { address: `${i + 10} Example Close\nSomerset`, mobile: `07700 9000${i + 10}` };
      return id;
    });
    let seed = 7, k = 0;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const now = today();
    roundRobin(tid, true).forEach((pairs, r) => {
      const date = addDays("2026-09-10", r * 7);
      for (const [home, away] of pairs) {
        const id = newId() + "x" + k++, p = date < now;
        d.fixtures[id] = { id, comp: "league", round: null, date, time: "19:45", home, away, venue: null, alley: null,
          homePins: p ? 250 + Math.round(rnd() * 80) : null, awayPins: p ? 240 + Math.round(rnd() * 80) : null };
      }
    });
    for (const [date, h, a, hp, ap] of [["2026-10-22", 0, 3, 301, 288], ["2026-10-22", 2, 5, 276, 276], ["2026-11-26", 1, 4, null, null]]) {
      const id = newId() + "c" + k++;
      d.fixtures[id] = { id, comp: "cup", round: "Round 1", date, time: "19:45", home: tid[h], away: tid[a], venue: null, alley: null, homePins: hp, awayPins: ap };
    }
  });
  S.busy = false;
  if (ok) toast("Example season loaded");
}

  if (act === "edit-team") VIEWS.teams.edit(id);
  if (act === "cancel-team") VIEWS.teams.reset();
  if (act === "del-team") {
    const n = Object.values(S.fixtures).filter(f => f.home === id || f.away === id).length;
    if (n) return toast(`${teamName(id)} has ${n} fixture${n > 1 ? "s" : ""}. Delete those first.`);
    if (!arm(b)) return;
    if (await commit(d => { delete d.teams[id]; delete d.contacts[id]; })) {
      toast("Team deleted");
      if ($("#team-form")?.dataset.id === id) VIEWS.teams.reset();
    }
  }
  if (act === "edit-venue") VIEWS.venues.edit(id);
  if (act === "cancel-venue") VIEWS.venues.reset();
  if (act === "del-venue") {
    const n = Object.values(S.teams).filter(t => t.venue === id).length;
    if (n) return toast(`${n} team${n > 1 ? "s use" : " uses"} this venue. Move ${n > 1 ? "them" : "it"} to another venue first.`);

    if (await commit(d => { delete d.venues[id]; })) {
      toast("Venue deleted");
      if ($("#venue-form")?.dataset.id === id) VIEWS.venues.reset();
    }
  }
  if (act === "save-result") VIEWS["manage-fixtures"].saveResult(id, b.closest(".fx-admin"));
  if (act === "edit-fx") VIEWS["manage-fixtures"].edit(id);
  if (act === "cancel-fx") VIEWS["manage-fixtures"].reset();
  if (act === "del-fx") {
    if (!arm(b, "Confirm")) return;

});
